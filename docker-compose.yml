version: '3.8'

services:
  vosk-transcriber:
    image: python:3.11-slim
    container_name: smartglasses-vosktran
    volumes:
      - models:/models
      - ./tools:/scripts:ro
    environment:
      - VOSK_MODEL_NAME=${VOSK_MODEL_NAME:-vosk-model-small-en-us-0.15}
      - MODEL_DIR=/models/${VOSK_MODEL_NAME:-vosk-model-small-en-us-0.15}
      - VOSK_MODEL_URL=${VOSK_MODEL_URL:-https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip}
      - PORT=8080
    command: sh -c "apt-get update && apt-get install -y libsndfile1 && pip install --no-cache-dir flask requests vosk soundfile && python /scripts/vosk_server.py"
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8080/health')"]
      interval: 20s
      timeout: 10s
      retries: 3
    # no external model-downloader dependency

  postgres:
    image: postgres:latest
    container_name: smartglasses-postgres
    environment:
      POSTGRES_DB: smartglasses
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    secrets:
      - postgres_password

  redis:
    image: redis:latest
    container_name: smartglasses-redis
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio:latest
    container_name: smartglasses-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    expose:
      - "9000"
      - "9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 30s
      timeout: 20s
      retries: 3

  ollama:
    image: ollama/ollama:latest
    container_name: smartglasses-ollama
    expose:
      - "11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
    # GPU device requests intentionally omitted for compatibility

  # faster-whisper removed — using vosk-transcriber instead
  app:
    build:
      context: .
      dockerfile: src/SmartGlassesMiddleware/Dockerfile
    container_name: smartglasses-app
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=smartglasses;Username=postgres;Password=REPLACE_WITH_SECRET
      - ConnectionStrings__Redis=${REDIS_HOST:-redis:6379}
      - MinIO__Endpoint=${MINIO_ENDPOINT:-minio:9000}
      - MinIO__AccessKey=REPLACE_WITH_SECRET
      - MinIO__SecretKey=REPLACE_WITH_SECRET
      - AI__OllamaEndpoint=${AI_OLLAMA_ENDPOINT:-http://ollama:11434}
      - AI__AdvancedModelEndpoint=${AI_ADVANCED_ENDPOINT:-http://localhost:5000/api/chat}
      - AI__AdvancedModelName=${AI_ADVANCED_MODEL_NAME:-gpt-4}
      - Transcription__Endpoint=http://vosk-transcriber:8080/transcribe
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_healthy
      ollama:
        condition: service_started
      # no faster-whisper or model-downloader dependencies
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    secrets:
      - postgres_password
      - minio_access_key
      - minio_secret_key
      - ai_advanced_endpoint

secrets:
  postgres_password:
    file: secrets/postgres_password
  minio_access_key:
    file: secrets/minio_access_key
  minio_secret_key:
    file: secrets/minio_secret_key
  ai_advanced_endpoint:
    file: secrets/ai_advanced_endpoint
  # huggingface_token removed (no longer required)

volumes:
  postgres-data:
  minio-data:
  ollama-data:
  models:
  # model-downloader-scripts removed

