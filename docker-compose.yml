version: '3.8'

services:
  postgres:
    image: postgres:latest
    container_name: smartglasses-postgres
    environment:
      POSTGRES_DB: smartglasses
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    secrets:
      - postgres_password

  redis:
    image: redis:latest
    container_name: smartglasses-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio:latest
    container_name: smartglasses-minio
    # Read MinIO credentials from secrets mounted at /run/secrets and then start
    command: sh -c "export MINIO_ROOT_USER=$(cat /run/secrets/minio_access_key) && export MINIO_ROOT_PASSWORD=$(cat /run/secrets/minio_secret_key) && exec minio server /data --console-address ':9001'"
    environment:
      MINIO_ROOT_USER: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    secrets:
      - minio_access_key
      - minio_secret_key

  ollama:
    image: ollama/ollama:latest
    container_name: smartglasses-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434"]
      interval: 30s
      timeout: 10s
      retries: 3
    # Allow GPU access when available (requires NVIDIA Container Toolkit / Docker configured for GPUs)
    device_requests:
      - driver: nvidia
        count: all
        capabilities: [gpu]

  app:
    build:
      context: .
      dockerfile: src/SmartGlassesMiddleware/Dockerfile
    container_name: smartglasses-app
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=smartglasses;Username=postgres;Password=REPLACE_WITH_SECRET
      - ConnectionStrings__Redis=${REDIS_HOST:-redis:6379}
      - MinIO__Endpoint=${MINIO_ENDPOINT:-minio:9000}
      - MinIO__AccessKey=REPLACE_WITH_SECRET
      - MinIO__SecretKey=REPLACE_WITH_SECRET
      - AI__OllamaEndpoint=${AI_OLLAMA_ENDPOINT:-http://ollama:11434}
      - AI__StrongerModelEndpoint=${AI_STRONGER_ENDPOINT:-http://localhost:5000/api/chat}
      - AI__StrongerModelName=${AI_STRONGER_MODEL_NAME:-gpt-4}
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    secrets:
      - postgres_password
      - minio_access_key
      - minio_secret_key
      - ai_stronger_endpoint

secrets:
  postgres_password:
    file: secrets/postgres_password
  minio_access_key:
    file: secrets/minio_access_key
  minio_secret_key:
    file: secrets/minio_secret_key
  ai_stronger_endpoint:
    file: secrets/ai_stronger_endpoint

volumes:
  postgres-data:
  minio-data:
  ollama-data:

