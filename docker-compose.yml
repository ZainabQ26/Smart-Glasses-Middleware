services:
  vosk-transcriber:
    build:
      context: ./tools
      dockerfile: Dockerfile
    container_name: smartglasses-vosk-transcriber
    volumes:
      - ${VOSK_MODELS_VOLUME:-models}:/models
    environment:
      - VOSK_MODEL_NAME=${VOSK_MODEL_NAME:-vosk-model-small-en-us-0.15}
      - MODEL_DIR=/models/${VOSK_MODEL_NAME:-vosk-model-small-en-us-0.15}
      - VOSK_MODEL_URL=${VOSK_MODEL_URL:-https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip}
      - PORT=8080
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health" ]
      interval: 20s
      timeout: 10s
      retries: 3

  postgres:
    image: pgvector/pgvector:pg17
    container_name: smartglasses-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smartglasses}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    expose:
      - "5432"
    volumes:
      - ${POSTGRES_DATA_VOLUME:-postgres-data}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:latest
    container_name: smartglasses-redis
    expose:
      - "6379"
    volumes:
      - ${REDIS_DATA_VOLUME:-redis-data}:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio:latest
    container_name: smartglasses-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin123}
    expose:
      - "9000"
      - "9001"
    volumes:
      - ${MINIO_DATA_VOLUME:-minio-data}:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 30s
      timeout: 20s
      retries: 3

  ollama:
    image: ollama/ollama:latest
    container_name: smartglasses-ollama
    expose:
      - "11434"
    volumes:
      - ${OLLAMA_DATA_VOLUME:-ollama-data}:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "echo 'ollama ready' > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
  app:
    build:
      context: .
      dockerfile: src/SmartGlassesMiddleware/Dockerfile
    container_name: smartglasses-app
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ConnectionStrings__DefaultConnection=Host=${POSTGRES_HOST:-postgres};Port=${POSTGRES_PORT:-5432};Database=${POSTGRES_DB:-smartglasses};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      - ConnectionStrings__Redis=${REDIS_HOST:-redis}:${REDIS_PORT:-6379}
      - MinIO__Endpoint=${MINIO_ENDPOINT:-minio:9000}
      - MinIO__AccessKey=${MINIO_ACCESS_KEY:-minioadmin}
      - MinIO__SecretKey=${MINIO_SECRET_KEY:-minioadmin123}
      - MinIO__BucketName=${MINIO_BUCKET_NAME:-smart-glasses-media}
      - AI__OllamaEndpoint=${OLLAMA_ENDPOINT:-http://ollama:11434}
      - AI__OllamaModel=${OLLAMA_MODEL:-llama-3.2-3b}
      - AI__OllamaEmbeddingModel=${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      - AI__OllamaTimeoutSeconds=${OLLAMA_TIMEOUT_SECONDS:-30}
      - AI__OllamaEmbeddingTimeoutSeconds=${OLLAMA_EMBEDDING_TIMEOUT_SECONDS:-30}
      - AI__AdvancedModelEndpoint=${AI_ADVANCED_ENDPOINT:-}
      - AI__AdvancedModelName=${AI_ADVANCED_MODEL_NAME:-gpt-4}
      - AI__KnownTasks__0=time
      - AI__KnownTasks__1=reminder
      - AI__KnownTasks__2=edit-reminder
      - AI__KnownTasks__3=delete-reminder
      - AI__KnownTasks__4=template
      - Transcription__Endpoint=${TRANSCRIPTION_ENDPOINT:-http://vosk-transcriber:8080}
      - MigrateOnStartup=${MIGRATE_ON_STARTUP:-false}
      - Cors__AllowedOrigins__0=${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      - BackgroundTasks__RetentionSeconds=${BACKGROUND_TASKS_RETENTION_SECONDS:-60}
      - BackgroundTasks__CleanupIntervalMinutes=${BACKGROUND_TASKS_CLEANUP_INTERVAL_MINUTES:-5}
      - ServiceTimeouts__TranscriptionTimeoutSeconds=${TRANSCRIPTION_TIMEOUT_SECONDS:-30}
      - ServiceTimeouts__AIServiceTimeoutSeconds=${AI_SERVICE_TIMEOUT_SECONDS:-60}
      - RateLimiting__Enabled=${RATE_LIMITING_ENABLED:-true}
      - RateLimiting__RequestsPerMinute=${RATE_LIMITING_REQUESTS_PER_MINUTE:-60}
      - Metrics__ApiKey=${METRICS_API_KEY:-}
      - RAG__MaxFileSizeMB=${RAG_MAX_FILE_SIZE_MB:-50}
      - RAG__MaxRetries=${RAG_MAX_RETRIES:-3}
      - RAG__RetryDelayMs=${RAG_RETRY_DELAY_MS:-1000}
      - RAG__BackgroundProcessingIntervalMinutes=${RAG_BACKGROUND_PROCESSING_INTERVAL_MINUTES:-15}
      - RAG__MaxContextTokens=${RAG_MAX_CONTEXT_TOKENS:-4000}
      - RAG__MaxLocalModelTokens=${RAG_MAX_LOCAL_MODEL_TOKENS:-2000}
      - RAG__ApproximateTokensPerChar=${RAG_APPROXIMATE_TOKENS_PER_CHAR:-0.25}
      - RAG__EmbeddingBatchSize=${RAG_EMBEDDING_BATCH_SIZE:-10}
      - RAG__EmbeddingMaxConcurrency=${RAG_EMBEDDING_MAX_CONCURRENCY:-5}
      - RAG__UseVectorDB=${RAG_USE_VECTOR_DB:-true}
      - RAG__VectorSimilarityThreshold=${RAG_VECTOR_SIMILARITY_THRESHOLD:-0.7}
      - Logging__LogLevel__Default=${LOG_LEVEL_DEFAULT:-Information}
      - Logging__LogLevel__Microsoft.AspNetCore=${LOG_LEVEL_ASPNETCORE:-Warning}
      - Logging__LogLevel__SmartGlassesMiddleware=${LOG_LEVEL_APP:-Information}
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      ollama:
        condition: service_healthy
      vosk-transcriber:
        condition: service_started

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres-data:
  redis-data:
  minio-data:
  ollama-data:
  models: