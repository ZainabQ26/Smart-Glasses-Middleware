services:
  github-runner:
    image: myoung34/github-runner:latest
    container_name: smart-glasses-github-runner
    restart: unless-stopped
    env_file:
      - .env
    environment:
      RUNNER_SCOPE: repo
      RUNNER_WORKDIR: /tmp/runner/work
      LABELS: self-hosted,linux,x64,docker,ubuntu-latest
      DISABLE_AUTO_UPDATE: "true"
      RUN_AS_ROOT: "false"
    volumes:
      - runner-data:/tmp/runner
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  runner-data:
