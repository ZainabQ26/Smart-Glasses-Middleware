name: Deploy to AWS

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'prod'
        type: choice
        options:
          - dev
          - staging
          - prod

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      
      - name: Restore dependencies
        run: dotnet restore
      
      - name: Build
        run: dotnet build --no-restore --configuration Release

  build-and-push:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      api-image: ${{ steps.api.outputs.api_image }}
      lambda-whisper-image: ${{ steps.lambda-whisper.outputs.lambda_image }}
      lambda-document-image: ${{ steps.lambda-document.outputs.lambda_image }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build & push API image
        id: api
        run: |
          IMAGE_URI=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/smart-glasses-api:${{ github.sha }}
          docker build -t $IMAGE_URI -f ./src/SmartGlassesMiddleware/Dockerfile .
          docker push $IMAGE_URI
          echo "api_image=$IMAGE_URI" >> $GITHUB_OUTPUT

      - name: Build & push Whisper Lambda image
        id: lambda-whisper
        run: |
          IMAGE_URI=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/whisper-lambda:${{ github.sha }}
          docker build -t $IMAGE_URI ./aws/lambda-whisper
          docker push $IMAGE_URI
          echo "lambda_image=$IMAGE_URI" >> $GITHUB_OUTPUT

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Document Processor Lambda zip
        id: lambda-document
        run: |
          cd aws/lambda-document-processor
          chmod +x build.sh
          ./build.sh
          echo "lambda_zip=aws/lambda-document-processor/deployment.zip" >> $GITHUB_OUTPUT

      - name: Upload Document Processor zip
        uses: actions/upload-artifact@v4
        with:
          name: lambda-document-zip
          path: aws/lambda-document-processor/deployment.zip

  terraform-apply:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.7

      - name: Destroy existing dev resources (best-effort, non-fatal)
        run: |
          set -e
          REGION=${AWS_REGION}
          ENV=dev
          PREFIX="smart-glasses-${ENV}"

          echo "Starting best-effort deletion of existing resources with prefix ${PREFIX} in ${REGION}"

          # non-fatal deletions
          set +e

          # ECR repositories
          aws ecr describe-repositories --repository-names "${PREFIX}-api" --region "$REGION" >/dev/null 2>&1 && aws ecr delete-repository --repository-name "${PREFIX}-api" --force --region "$REGION" || true

          # KMS aliases
          for a in "alias/${PREFIX}-ecr" "alias/${PREFIX}-rds" "alias/${PREFIX}-s3"; do
            aws kms list-aliases --region "$REGION" --query "Aliases[?AliasName=='$a']" --output text >/dev/null 2>&1 && aws kms delete-alias --alias-name "$a" --region "$REGION" || true
          done

          # CloudFront origin request policy
          ORIGIN_POLICY_ID=$(aws cloudfront list-origin-request-policies --query "OriginRequestPolicyList.Items[?Name=='${PREFIX}-api-policy'].Id" --output text 2>/dev/null || true)
          if [ -n "$ORIGIN_POLICY_ID" ]; then aws cloudfront delete-origin-request-policy --id "$ORIGIN_POLICY_ID" || true; fi

          # CloudFront origin access control
          OAC_ID=$(aws cloudfront list-origin-access-controls --query "OriginAccessControlList.Items[?Name=='${PREFIX}-frontend-oac'].Id" --output text 2>/dev/null || true)
          if [ -n "$OAC_ID" ]; then aws cloudfront delete-origin-access-control --id "$OAC_ID" || true; fi

          # CloudWatch Log Groups (examples from logs)
          aws logs delete-log-group --log-group-name "/ecs/${PREFIX}/api" --region "$REGION" || true
          aws logs delete-log-group --log-group-name "/aws/elasticache/${PREFIX}/slow-log" --region "$REGION" || true
          aws logs delete-log-group --log-group-name "/aws/elasticache/${PREFIX}/engine-log" --region "$REGION" || true
          aws logs delete-log-group --log-group-name "/aws/lambda/${PREFIX}-document-processor" --region "$REGION" || true

          # IAM roles and policies (detach and delete)
          delete_role() {
            RNAME="$1"
            ARN=$(aws iam get-role --role-name "$RNAME" --query 'Role.Arn' --output text 2>/dev/null || true)
            if [ -n "$ARN" ]; then
              # detach managed policies
              for p in $(aws iam list-attached-role-policies --role-name "$RNAME" --query 'AttachedPolicies[].PolicyArn' --output text 2>/dev/null || true); do
                aws iam detach-role-policy --role-name "$RNAME" --policy-arn "$p" || true
              done
              # delete inline policies
              for ip in $(aws iam list-role-policies --role-name "$RNAME" --query 'PolicyNames[]' --output text 2>/dev/null || true); do
                aws iam delete-role-policy --role-name "$RNAME" --policy-name "$ip" || true
              done
              aws iam delete-role --role-name "$RNAME" || true
            fi
          }

          delete_role "${PREFIX}-ecs-task-execution-role"
          delete_role "${PREFIX}-ecs-task-role"
          delete_role "${PREFIX}-lambda-doc-processor-role"
          delete_role "${PREFIX}-rds-monitoring-role"
          delete_role "${PREFIX}-whisper-exec"

          # IAM policies by name
          for pname in "${PREFIX}-whisper-s3-access" "${PREFIX}-whisper-allow-sqs-send"; do
            POL_ARN=$(aws iam list-policies --scope Local --query "Policies[?PolicyName=='$pname'].Arn" --output text 2>/dev/null || true)
            if [ -n "$POL_ARN" ]; then aws iam delete-policy --policy-arn "$POL_ARN" || true; fi
          done

          # Parameter groups
          aws elasticache describe-cache-parameter-groups --cache-parameter-group-name "${PREFIX}-redis-params" --region "$REGION" >/dev/null 2>&1 && aws elasticache delete-cache-parameter-group --cache-parameter-group-name "${PREFIX}-redis-params" --region "$REGION" || true
          aws rds describe-db-cluster-parameter-groups --db-cluster-parameter-group-name "${PREFIX}-aurora-pg-params" --region "$REGION" >/dev/null 2>&1 && aws rds delete-db-cluster-parameter-group --db-cluster-parameter-group-name "${PREFIX}-aurora-pg-params" --region "$REGION" || true

          # Attempt to remove VPC (best-effort). This will try to clean common attachments and delete the VPC tagged for this project/env.
          VPC_ID=$(aws ec2 describe-vpcs --filters "Name=tag:Project,Values=SmartGlassesMiddleware" "Name=tag:Environment,Values=$ENV" --query 'Vpcs[0].VpcId' --output text 2>/dev/null || true)
          if [ -n "$VPC_ID" ] && [ "$VPC_ID" != "None" ]; then
            echo "Attempting to clean and delete VPC $VPC_ID"
            # Delete NAT Gateways
            for nat in $(aws ec2 describe-nat-gateways --filter Name=vpc-id,Values=$VPC_ID --query 'NatGateways[].NatGatewayId' --output text 2>/dev/null || true); do
              aws ec2 delete-nat-gateway --nat-gateway-id $nat --region "$REGION" || true
            done
            # Detach and delete internet gateways
            for igw in $(aws ec2 describe-internet-gateways --filters "Name=attachment.vpc-id,Values=$VPC_ID" --query 'InternetGateways[].InternetGatewayId' --output text 2>/dev/null || true); do
              aws ec2 detach-internet-gateway --internet-gateway-id $igw --vpc-id $VPC_ID --region "$REGION" || true
              aws ec2 delete-internet-gateway --internet-gateway-id $igw --region "$REGION" || true
            done
            # Delete subnets
            for s in $(aws ec2 describe-subnets --filters "Name=vpc-id,Values=$VPC_ID" --query 'Subnets[].SubnetId' --output text 2>/dev/null || true); do
              aws ec2 delete-subnet --subnet-id $s --region "$REGION" || true
            done
            # Delete route tables (non-main)
            for rt in $(aws ec2 describe-route-tables --filters "Name=vpc-id,Values=$VPC_ID" --query 'RouteTables[?Associations[?Main==`false`]].RouteTableId' --output text 2>/dev/null || true); do
              aws ec2 delete-route-table --route-table-id $rt --region "$REGION" || true
            done
            # Delete security groups (non-default)
            for sg in $(aws ec2 describe-security-groups --filters "Name=vpc-id,Values=$VPC_ID" --query 'SecurityGroups[?GroupName!=`default`].GroupId' --output text 2>/dev/null || true); do
              aws ec2 delete-security-group --group-id $sg --region "$REGION" || true
            done
            # Finally attempt delete VPC
            aws ec2 delete-vpc --vpc-id $VPC_ID --region "$REGION" || true
          fi

          set -e

          echo "Best-effort deletion complete."

      - name: Write image variables for Terraform
        run: |
          cat > aws/infrastructure/tf_image_vars.auto.tfvars <<EOF
          api_image = "${{ needs.build-and-push.outputs.api-image }}"
          lambda_whisper_image = "${{ needs.build-and-push.outputs.lambda-whisper-image }}"
          lambda_image = "${{ needs.build-and-push.outputs.lambda-whisper-image }}"
          lambda_document_image = "${{ needs.build-and-push.outputs.lambda-document-image }}"
          deployment_id = "${{ github.run_id }}"
          EOF

      - name: Download Document Processor zip
        uses: actions/download-artifact@v4
        with:
          name: lambda-document-zip
          path: .

      - name: Place Document Processor zip into terraform path
        run: |
          mkdir -p aws/lambda-document-processor
          if [ -f aws/lambda-document-processor/deployment.zip ]; then
            echo "deployment.zip already in place"
          elif [ -f deployment.zip ]; then
            mv deployment.zip aws/lambda-document-processor/deployment.zip
            echo "moved deployment.zip to aws/lambda-document-processor/deployment.zip"
          else
            echo "No deployment.zip found after download";
            ls -la || true;
            exit 1
          fi

      - name: Terraform init
        working-directory: aws/infrastructure
        run: |
          # Create S3 backend bucket (us-east-1 must NOT use --create-bucket-configuration)
          BUCKET_NAME="smart-glasses-terraform-state-dev"
          DDB_NAME="smart-glasses-terraform-locks-dev"
          aws s3api head-bucket --bucket "$BUCKET_NAME" --region "$AWS_REGION" >/dev/null 2>&1 || (
            if [ "$AWS_REGION" = "us-east-1" ]; then
              aws s3api create-bucket --bucket "$BUCKET_NAME" --region "$AWS_REGION" || true
            else
              aws s3api create-bucket --bucket "$BUCKET_NAME" --region "$AWS_REGION" --create-bucket-configuration LocationConstraint=$AWS_REGION || true
            fi
          )
          aws dynamodb describe-table --table-name "$DDB_NAME" --region "$AWS_REGION" >/dev/null 2>&1 || aws dynamodb create-table --table-name "$DDB_NAME" --attribute-definitions AttributeName=LockID,AttributeType=S --key-schema AttributeName=LockID,KeyType=HASH --billing-mode PAY_PER_REQUEST --region "$AWS_REGION" || true

          # Remove old local state files and initialize with S3 backend
          rm -rf .terraform.lock.hcl terraform.tfstate* 2>/dev/null || true
          terraform init -backend-config="bucket=${BUCKET_NAME}" -backend-config="key=state/terraform.tfstate" -backend-config="region=${AWS_REGION}" -backend-config="dynamodb_table=${DDB_NAME}"

      - name: Import critical resources into fresh state
        working-directory: aws/infrastructure
        run: |
          set +e

          echo "=== Importing critical resources into fresh state (non-fatal) ==="

          {
            # Import S3 buckets (REQUIRED - data)
            terraform import aws_s3_bucket.media smart-glasses-dev-media || true
            terraform import aws_s3_bucket.documents smart-glasses-dev-documents || true
            terraform import aws_s3_bucket.frontend smart-glasses-dev-frontend || true

            # Import KMS (encrypts S3)
            terraform import aws_kms_key.s3 $(aws kms describe-key --key-id alias/smart-glasses-dev-s3 --query 'KeyMetadata.KeyId' --output text) 2>/dev/null || true
            terraform import aws_kms_alias.s3 alias/smart-glasses-dev-s3 2>/dev/null || true
            terraform import aws_kms_key.rds $(aws kms describe-key --key-id alias/smart-glasses-dev-rds --query 'KeyMetadata.KeyId' --output text) 2>/dev/null || true
            terraform import aws_kms_alias.rds alias/smart-glasses-dev-rds 2>/dev/null || true

            # Import Secrets (sensitive data) - may fail if names/ARNs differ
            terraform import aws_secretsmanager_secret.app_secrets arn:aws:secretsmanager:${AWS_REGION}:${{ secrets.AWS_ACCOUNT_ID }}:secret:smart-glasses-dev-app-secrets || true
            terraform import aws_secretsmanager_secret.db_credentials arn:aws:secretsmanager:${AWS_REGION}:${{ secrets.AWS_ACCOUNT_ID }}:secret:smart-glasses-dev-db-credentials || true
            terraform import aws_secretsmanager_secret.redis_credentials arn:aws:secretsmanager:${AWS_REGION}:${{ secrets.AWS_ACCOUNT_ID }}:secret:smart-glasses-dev-redis-credentials || true
          } || true

          echo "=== Critical resource import complete (non-fatal) ==="
          set -e

      - name: Terraform apply
        working-directory: aws/infrastructure
        run: |
          terraform apply -auto-approve \
            -var "environment=dev" \
            -var "aws_region=${AWS_REGION}"

      - name: Save Terraform outputs
        working-directory: aws/infrastructure
        run: terraform output -json > tf_outputs.json

      - name: Upload tf outputs
        uses: actions/upload-artifact@v4
        with:
          name: tf-outputs
          path: aws/infrastructure/tf_outputs.json

  verify-deployment:
    name: Wait for ECS service stability
    needs: terraform-apply
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
    steps:
      - name: Download tf outputs
        uses: actions/download-artifact@v4
        with:
          name: tf-outputs
          path: ./tf

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Wait for ECS service to stabilize
        run: |
          CLUSTER=$(jq -r '.ecs_cluster_name.value' ./tf/tf_outputs.json)
          SERVICE="smart-glasses-dev-api-service"
          echo "Waiting for ECS service $SERVICE in cluster $CLUSTER to stabilize (includes DB migrations via MIGRATE_ON_STARTUP)..."
          aws ecs wait services-stable \
            --cluster "$CLUSTER" \
            --services "$SERVICE" \
            --region "$AWS_REGION"
          echo "ECS service is stable."

      - name: Smoke-test health endpoint
        run: |
          ALB=$(jq -r '.api_alb_dns.value' ./tf/tf_outputs.json)
          echo "Health check: http://${ALB}/health"
          for i in $(seq 1 5); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://${ALB}/health" || true)
            echo "Attempt $i: HTTP $STATUS"
            [ "$STATUS" = "200" ] && exit 0
            sleep 15
          done
          echo "Health check did not return 200 after retries"
          exit 1
