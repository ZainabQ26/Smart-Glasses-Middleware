name: Deploy to AWS

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'prod'
        type: choice
        options:
          - dev
          - staging
          - prod

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      
      - name: Restore dependencies
        run: dotnet restore
      
      - name: Build
        run: dotnet build --no-restore --configuration Release

  build-and-push:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      api-image: ${{ steps.api.outputs.api_image }}
      lambda-whisper-image: ${{ steps.lambda-whisper.outputs.lambda_image }}
      lambda-document-image: ${{ steps.lambda-document.outputs.lambda_image }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build & push API image
        id: api
        run: |
          IMAGE_URI=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/smart-glasses-api:${{ github.sha }}
          docker build -t $IMAGE_URI -f ./src/SmartGlassesMiddleware/Dockerfile .
          docker push $IMAGE_URI
          echo "api_image=$IMAGE_URI" >> $GITHUB_OUTPUT

      - name: Build & push Whisper Lambda image
        id: lambda-whisper
        run: |
          IMAGE_URI=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/whisper-lambda:${{ github.sha }}
          docker build -t $IMAGE_URI ./aws/lambda-whisper
          docker push $IMAGE_URI
          echo "lambda_image=$IMAGE_URI" >> $GITHUB_OUTPUT

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Document Processor Lambda zip
        id: lambda-document
        run: |
          cd aws/lambda-document-processor
          chmod +x build.sh
          ./build.sh
          echo "lambda_zip=aws/lambda-document-processor/deployment.zip" >> $GITHUB_OUTPUT

  terraform-apply:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.7

      - name: Write image variables for Terraform
        run: |
          cat > aws/infrastructure/tf_image_vars.auto.tfvars <<EOF
          api_image = "${{ needs.build-and-push.outputs.api-image }}"
          lambda_whisper_image = "${{ needs.build-and-push.outputs.lambda-whisper-image }}"
          lambda_image = "${{ needs.build-and-push.outputs.lambda-whisper-image }}"
          lambda_document_image = "${{ needs.build-and-push.outputs.lambda-document-image }}"
          EOF

      - name: Terraform init
        working-directory: aws/infrastructure
        run: terraform init

      - name: Import existing resources (if any)
        working-directory: aws/infrastructure
        run: |
          set +e
          
          # S3 buckets
          terraform import aws_s3_bucket.media smart-glasses-dev-media 2>/dev/null || true
          terraform import aws_s3_bucket.documents smart-glasses-dev-documents 2>/dev/null || true
          terraform import aws_s3_bucket.frontend smart-glasses-dev-frontend 2>/dev/null || true
          
          # KMS keys and aliases
          terraform import aws_kms_alias.s3 alias/smart-glasses-dev-s3 2>/dev/null || true
          terraform import aws_kms_alias.rds alias/smart-glasses-dev-rds 2>/dev/null || true
          
          # Secrets (by ARN)
          terraform import aws_secretsmanager_secret.app_secrets arn:aws:secretsmanager:${AWS_REGION}:${{ secrets.AWS_ACCOUNT_ID }}:secret:smart-glasses-dev-app-secrets-* 2>/dev/null || true
          terraform import aws_secretsmanager_secret.db_credentials arn:aws:secretsmanager:${AWS_REGION}:${{ secrets.AWS_ACCOUNT_ID }}:secret:smart-glasses-dev-db-credentials-* 2>/dev/null || true
          terraform import aws_secretsmanager_secret.redis_credentials arn:aws:secretsmanager:${AWS_REGION}:${{ secrets.AWS_ACCOUNT_ID }}:secret:smart-glasses-dev-redis-credentials-* 2>/dev/null || true
          
          # RDS Subnet Group and Parameter Group
          terraform import aws_db_subnet_group.main smart-glasses-dev-db-subnet-group 2>/dev/null || true
          terraform import aws_rds_cluster_parameter_group.main smart-glasses-dev-aurora-pg-params 2>/dev/null || true
          
          # RDS Monitoring Role and Policy
          terraform import aws_iam_role.rds_monitoring smart-glasses-dev-rds-monitoring-role 2>/dev/null || true
          terraform import aws_iam_role_policy.rds_monitoring smart-glasses-dev-rds-monitoring-role/inline-policy 2>/dev/null || true
          
          # Lambda Execution Roles and Inline Policies
          terraform import aws_iam_role.lambda_exec smart-glasses-whisper-exec 2>/dev/null || true
          terraform import aws_iam_role_policy.lambda_exec smart-glasses-whisper-exec/inline-policy 2>/dev/null || true
          terraform import aws_iam_role.lambda_document_exec smart-glasses-document-exec 2>/dev/null || true
          terraform import aws_iam_role_policy.lambda_document_exec smart-glasses-document-exec/inline-policy 2>/dev/null || true
          
          # Lambda IAM Policies
          terraform import aws_iam_policy.lambda_s3_access arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:policy/smart-glasses-whisper-s3-access 2>/dev/null || true
          terraform import aws_iam_policy.allow_sqs_send arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:policy/smart-glasses-whisper-allow-sqs-send 2>/dev/null || true
          
          # Lambda Functions (import by function name)
          terraform import aws_lambda_function.whisper smart-glasses-dev-whisper 2>/dev/null || true
          terraform import aws_lambda_function.document_processor smart-glasses-dev-document-processor 2>/dev/null || true
          
          # ALB and target group
          ALB_ARN=$(aws elbv2 describe-load-balancers --query "LoadBalancers[?LoadBalancerName=='smart-glasses-dev-api-alb'].LoadBalancerArn" --output text 2>/dev/null)
          if [ -n "$ALB_ARN" ] && [ "$ALB_ARN" != "None" ]; then
            terraform import aws_lb.api "$ALB_ARN" 2>/dev/null || true
            TG_ARN=$(aws elbv2 describe-target-groups --load-balancer-arn "$ALB_ARN" --query "TargetGroups[?TargetGroupName=='smart-glasses-dev-api-tg'].TargetGroupArn" --output text 2>/dev/null)
            if [ -n "$TG_ARN" ] && [ "$TG_ARN" != "None" ]; then
              terraform import aws_lb_target_group.api "$TG_ARN" 2>/dev/null || true
            fi
          fi
          
          # CloudFront OAC
          OAC_ID=$(aws cloudfront list-origin-access-controls --query "OriginAccessControlList.Items[?Name=='smart-glasses-dev-frontend-oac'].Id" --output text 2>/dev/null)
          if [ -n "$OAC_ID" ] && [ "$OAC_ID" != "None" ]; then
            terraform import aws_cloudfront_origin_access_control.frontend "$OAC_ID" 2>/dev/null || true
          fi
          
          # CloudWatch Log Groups
          terraform import aws_cloudwatch_log_group.elasticache_slow_log "/aws/elasticache/smart-glasses-dev/slow-log" 2>/dev/null || true
          terraform import aws_cloudwatch_log_group.elasticache_engine_log "/aws/elasticache/smart-glasses-dev/engine-log" 2>/dev/null || true
          terraform import aws_cloudwatch_log_group.lambda_whisper "/aws/lambda/smart-glasses-dev-whisper" 2>/dev/null || true
          terraform import aws_cloudwatch_log_group.lambda_document_processor "/aws/lambda/smart-glasses-dev-document-processor" 2>/dev/null || true
          terraform import aws_cloudwatch_log_group.ecs_api "/ecs/smart-glasses-dev/api" 2>/dev/null || true
          
          # ECS Cluster
          terraform import aws_ecs_cluster.main smart-glasses-dev-cluster 2>/dev/null || true
          
          set -e

      - name: Terraform apply
        working-directory: aws/infrastructure
        run: terraform apply -auto-approve

      - name: Save Terraform outputs
        working-directory: aws/infrastructure
        run: terraform output -json > tf_outputs.json

      - name: Upload tf outputs
        uses: actions/upload-artifact@v4
        with:
          name: tf-outputs
          path: aws/infrastructure/tf_outputs.json

  run-migrations:
    needs: terraform-apply
    runs-on: ubuntu-latest
    steps:
      - name: Download tf outputs
        uses: actions/download-artifact@v4
        with:
          name: tf-outputs
          path: ./tf

      - name: Extract DB endpoint
        id: db
        run: |
          DB_ENDPOINT=$(jq -r '.rds_endpoint.value' ./tf/tf_outputs.json)
          echo "DB_ENDPOINT=$DB_ENDPOINT" >> $GITHUB_ENV

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Run EF migrations
        env:
          ConnectionStrings__DefaultConnection: "Host=${{ env.DB_ENDPOINT }};Database=${{ secrets.DB_NAME }};Username=${{ secrets.DB_USER }};Password=${{ secrets.DB_PASSWORD }}"
        run: |
          cd src/SmartGlassesMiddleware
          dotnet tool restore
          dotnet restore
          dotnet ef database update --no-build
