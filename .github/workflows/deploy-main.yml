name: Deploy to AWS

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'prod'
        type: choice
        options:
          - dev
          - staging
          - prod

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      
      - name: Restore dependencies
        run: dotnet restore
      
      - name: Build
        run: dotnet build --no-restore --configuration Release

  build-and-push:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      api-image: ${{ steps.api.outputs.api_image }}
      lambda-whisper-image: ${{ steps.lambda-whisper.outputs.lambda_image }}
      lambda-document-image: ${{ steps.lambda-document.outputs.lambda_image }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}
          # Don't mask the account ID so it can appear in job outputs without being blanked
          mask-aws-account-id: false

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build & push API image
        id: api
        run: |
          # Use the registry URL from the ECR login action output (no secret masking)
          IMAGE_URI=${{ steps.ecr-login.outputs.registry }}/smart-glasses-api:${{ github.sha }}
          docker build -t $IMAGE_URI -f ./src/SmartGlassesMiddleware/Dockerfile .
          docker push $IMAGE_URI
          echo "api_image=$IMAGE_URI" >> $GITHUB_OUTPUT

      - name: Build & push Whisper Lambda image
        id: lambda-whisper
        run: |
          IMAGE_URI=${{ steps.ecr-login.outputs.registry }}/whisper-lambda:${{ github.sha }}
          docker build --platform linux/amd64 --provenance=false -t $IMAGE_URI ./aws/lambda-whisper
          docker push $IMAGE_URI
          echo "lambda_image=$IMAGE_URI" >> $GITHUB_OUTPUT

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Document Processor Lambda zip
        id: lambda-document
        run: |
          cd aws/lambda-document-processor
          chmod +x build.sh
          ./build.sh
          echo "lambda_zip=aws/lambda-document-processor/deployment.zip" >> $GITHUB_OUTPUT

      - name: Upload Document Processor zip
        uses: actions/upload-artifact@v4
        with:
          name: lambda-document-zip
          path: aws/lambda-document-processor/deployment.zip

  terraform-apply:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}
          # Required so aws sts get-caller-identity returns the account ID unmasked
          mask-aws-account-id: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.7

      - name: Destroy existing dev resources (best-effort, non-fatal)
        run: |
          set -e
          REGION=${AWS_REGION}
          ENV=dev
          PREFIX="smart-glasses-${ENV}"

          echo "Starting best-effort deletion of existing resources with prefix ${PREFIX} in ${REGION}"

          # non-fatal deletions
          set +e

          # ECR repositories
          aws ecr describe-repositories --repository-names "${PREFIX}-api" --region "$REGION" >/dev/null 2>&1 && aws ecr delete-repository --repository-name "${PREFIX}-api" --force --region "$REGION" || true

          # KMS aliases
          for a in "alias/${PREFIX}-ecr" "alias/${PREFIX}-rds" "alias/${PREFIX}-s3"; do
            aws kms list-aliases --region "$REGION" --query "Aliases[?AliasName=='$a']" --output text >/dev/null 2>&1 && aws kms delete-alias --alias-name "$a" --region "$REGION" || true
          done

          # NOTE: CloudFront OAC and origin request policy are NOT deleted here.
          # They cannot be deleted while associated with a CloudFront distribution.
          # They are handled via terraform import in the import step below.

          # CloudWatch Log Groups (examples from logs)
          aws logs delete-log-group --log-group-name "/ecs/${PREFIX}/api" --region "$REGION" || true
          aws logs delete-log-group --log-group-name "/aws/elasticache/${PREFIX}/slow-log" --region "$REGION" || true
          aws logs delete-log-group --log-group-name "/aws/elasticache/${PREFIX}/engine-log" --region "$REGION" || true
          aws logs delete-log-group --log-group-name "/aws/lambda/${PREFIX}-document-processor" --region "$REGION" || true

          # IAM roles and policies (detach and delete)
          delete_role() {
            RNAME="$1"
            ARN=$(aws iam get-role --role-name "$RNAME" --query 'Role.Arn' --output text 2>/dev/null || true)
            if [ -n "$ARN" ]; then
              # detach managed policies
              for p in $(aws iam list-attached-role-policies --role-name "$RNAME" --query 'AttachedPolicies[].PolicyArn' --output text 2>/dev/null || true); do
                aws iam detach-role-policy --role-name "$RNAME" --policy-arn "$p" || true
              done
              # delete inline policies
              for ip in $(aws iam list-role-policies --role-name "$RNAME" --query 'PolicyNames[]' --output text 2>/dev/null || true); do
                aws iam delete-role-policy --role-name "$RNAME" --policy-name "$ip" || true
              done
              aws iam delete-role --role-name "$RNAME" || true
            fi
          }

          delete_role "${PREFIX}-ecs-task-execution-role"
          delete_role "${PREFIX}-ecs-task-role"
          delete_role "${PREFIX}-lambda-doc-processor-role"
          delete_role "${PREFIX}-rds-monitoring-role"
          delete_role "${PREFIX}-whisper-exec"

          # IAM policies by name
          for pname in "${PREFIX}-whisper-s3-access" "${PREFIX}-whisper-allow-sqs-send"; do
            POL_ARN=$(aws iam list-policies --scope Local --query "Policies[?PolicyName=='$pname'].Arn" --output text 2>/dev/null || true)
            if [ -n "$POL_ARN" ]; then aws iam delete-policy --policy-arn "$POL_ARN" || true; fi
          done

          # NOTE: ElastiCache parameter group and RDS cluster parameter group are NOT
          # deleted here. They cannot be deleted while their clusters/replication groups
          # still exist. They are handled via terraform import in the import step.
          # NOTE: VPC is NOT deleted here. The VPC will be imported so Terraform manages
          # the existing one rather than trying to create a new one (which would exceed
          # the account's VPC limit if 5 VPCs already exist).

          set -e

          echo "Best-effort deletion complete."

      - name: Write image variables for Terraform
        run: |
          # Derive the ECR registry from STS (not from a secret, so values are never masked)
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          SHA="${{ github.sha }}"
          cat > aws/infrastructure/tf_image_vars.auto.tfvars <<EOF
          api_image = "${REGISTRY}/smart-glasses-api:${SHA}"
          lambda_whisper_image = "${REGISTRY}/whisper-lambda:${SHA}"
          lambda_image = "${REGISTRY}/whisper-lambda:${SHA}"
          lambda_document_image = ""
          deployment_id = "${{ github.run_id }}"
          EOF

      - name: Download Document Processor zip
        uses: actions/download-artifact@v4
        with:
          name: lambda-document-zip
          path: .

      - name: Place Document Processor zip into terraform path
        run: |
          mkdir -p aws/lambda-document-processor
          if [ -f aws/lambda-document-processor/deployment.zip ]; then
            echo "deployment.zip already in place"
          elif [ -f deployment.zip ]; then
            mv deployment.zip aws/lambda-document-processor/deployment.zip
            echo "moved deployment.zip to aws/lambda-document-processor/deployment.zip"
          else
            echo "No deployment.zip found after download";
            ls -la || true;
            exit 1
          fi

      - name: Terraform init
        working-directory: aws/infrastructure
        run: |
          # Create S3 backend bucket (us-east-1 must NOT use --create-bucket-configuration)
          BUCKET_NAME="smart-glasses-terraform-state-dev"
          DDB_NAME="smart-glasses-terraform-locks-dev"
          aws s3api head-bucket --bucket "$BUCKET_NAME" --region "$AWS_REGION" >/dev/null 2>&1 || (
            if [ "$AWS_REGION" = "us-east-1" ]; then
              aws s3api create-bucket --bucket "$BUCKET_NAME" --region "$AWS_REGION" || true
            else
              aws s3api create-bucket --bucket "$BUCKET_NAME" --region "$AWS_REGION" --create-bucket-configuration LocationConstraint=$AWS_REGION || true
            fi
          )
          aws dynamodb describe-table --table-name "$DDB_NAME" --region "$AWS_REGION" >/dev/null 2>&1 || aws dynamodb create-table --table-name "$DDB_NAME" --attribute-definitions AttributeName=LockID,AttributeType=S --key-schema AttributeName=LockID,KeyType=HASH --billing-mode PAY_PER_REQUEST --region "$AWS_REGION" || true

          # Force-release any stale lock left by a previous failed run.
          # CI runs are sequential, so this is safe.
          aws dynamodb delete-item \
            --table-name "$DDB_NAME" \
            --key "{\"LockID\":{\"S\":\"${BUCKET_NAME}/state/terraform.tfstate\"}}" \
            --region "$AWS_REGION" 2>/dev/null || true

          # Remove old local state files and initialize with S3 backend
          rm -rf .terraform.lock.hcl terraform.tfstate* 2>/dev/null || true
          terraform init -backend-config="bucket=${BUCKET_NAME}" -backend-config="key=state/terraform.tfstate" -backend-config="region=${AWS_REGION}" -backend-config="dynamodb_table=${DDB_NAME}"

      - name: Import pre-existing resources into Terraform state
        working-directory: aws/infrastructure
        run: |
          set +e
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REGION="${AWS_REGION}"
          ENV=dev
          PREFIX="smart-glasses-${ENV}"

          echo "=== Importing pre-existing AWS resources (all non-fatal) ==="

          # ── S3 buckets (contain data – must import not recreate) ──────────────
          terraform import aws_s3_bucket.media          ${PREFIX}-media      || true
          terraform import aws_s3_bucket.documents      ${PREFIX}-documents  || true
          terraform import aws_s3_bucket.frontend       ${PREFIX}-frontend   || true

          # ── KMS keys and aliases ──────────────────────────────────────────────
          KMS_S3=$(aws kms describe-key --key-id alias/${PREFIX}-s3  --query 'KeyMetadata.KeyId' --output text 2>/dev/null || true)
          KMS_RDS=$(aws kms describe-key --key-id alias/${PREFIX}-rds --query 'KeyMetadata.KeyId' --output text 2>/dev/null || true)
          [ -n "$KMS_S3"  ] && [ "$KMS_S3"  != "None" ] && terraform import aws_kms_key.s3   "$KMS_S3"  || true
          [ -n "$KMS_RDS" ] && [ "$KMS_RDS" != "None" ] && terraform import aws_kms_key.rds  "$KMS_RDS" || true
          terraform import aws_kms_alias.s3  alias/${PREFIX}-s3  || true
          terraform import aws_kms_alias.rds alias/${PREFIX}-rds || true

          # ── Secrets Manager ───────────────────────────────────────────────────
          terraform import aws_secretsmanager_secret.app_secrets      arn:aws:secretsmanager:${REGION}:${ACCOUNT_ID}:secret:${PREFIX}-app-secrets      || true
          terraform import aws_secretsmanager_secret.db_credentials   arn:aws:secretsmanager:${REGION}:${ACCOUNT_ID}:secret:${PREFIX}-db-credentials   || true
          terraform import aws_secretsmanager_secret.redis_credentials arn:aws:secretsmanager:${REGION}:${ACCOUNT_ID}:secret:${PREFIX}-redis-credentials || true

          # ── CloudFront (OAC and origin request policy cannot be deleted while
          #    associated with a distribution, so import instead of recreate) ───
          OAC_ID=$(aws cloudfront list-origin-access-controls \
            --query "OriginAccessControlList.Items[?Name=='${PREFIX}-frontend-oac'].Id" \
            --output text 2>/dev/null || true)
          [ -n "$OAC_ID" ] && [ "$OAC_ID" != "None" ] && \
            terraform import aws_cloudfront_origin_access_control.frontend "$OAC_ID" || true

          ORP_ID=$(aws cloudfront list-origin-request-policies --type custom \
            --query "OriginRequestPolicyList.Items[?OriginRequestPolicy.OriginRequestPolicyConfig.Name=='${PREFIX}-api-policy'].OriginRequestPolicy.Id" \
            --output text 2>/dev/null | tr '\t' '\n' | head -1 || true)
          [ -n "$ORP_ID" ] && [ "$ORP_ID" != "None" ] && \
            terraform import aws_cloudfront_origin_request_policy.api "$ORP_ID" || true

          # ── ElastiCache parameter group (can't delete while replication group exists) ──
          terraform import aws_elasticache_parameter_group.redis ${PREFIX}-redis-params || true

          # ── ElastiCache Subnet Group ──────────────────────────────────────────
          terraform import aws_elasticache_subnet_group.main ${PREFIX}-elasticache-subnet-group || true

          # ── RDS DB Subnet Group ───────────────────────────────────────────────
          terraform import aws_db_subnet_group.main ${PREFIX}-db-subnet-group || true

          # ── ALB and Target Group ──────────────────────────────────────────────
          ALB_ARN=$(aws elbv2 describe-load-balancers --names "${PREFIX}-api-alb" \
            --query 'LoadBalancers[0].LoadBalancerArn' --output text --region "$REGION" 2>/dev/null || true)
          [ -n "$ALB_ARN" ] && [ "$ALB_ARN" != "None" ] && terraform import aws_lb.api "$ALB_ARN" || true

          TG_ARN=$(aws elbv2 describe-target-groups --names "${PREFIX}-api-tg" \
            --query 'TargetGroups[0].TargetGroupArn' --output text --region "$REGION" 2>/dev/null || true)
          [ -n "$TG_ARN" ] && [ "$TG_ARN" != "None" ] && terraform import aws_lb_target_group.api "$TG_ARN" || true

          # ── VPC and all network sub-resources (import to avoid VPC limit errors) ──
          VPC_ID=$(aws ec2 describe-vpcs \
            --filters "Name=tag:Project,Values=SmartGlassesMiddleware" "Name=tag:Environment,Values=${ENV}" \
            --query 'Vpcs[0].VpcId' --output text --region "$REGION" 2>/dev/null || true)

          if [ -n "$VPC_ID" ] && [ "$VPC_ID" != "None" ]; then
            echo "Importing existing project VPC: $VPC_ID"
            terraform import aws_vpc.main "$VPC_ID" || true

            # Internet Gateway
            IGW_ID=$(aws ec2 describe-internet-gateways \
              --filters "Name=attachment.vpc-id,Values=$VPC_ID" \
              --query 'InternetGateways[0].InternetGatewayId' --output text --region "$REGION" 2>/dev/null || true)
            [ -n "$IGW_ID" ] && [ "$IGW_ID" != "None" ] && terraform import aws_internet_gateway.main "$IGW_ID" || true

            # Subnets (sorted by AZ for stable index ordering)
            readarray -t PUB_SUBNETS < <(aws ec2 describe-subnets \
              --filters "Name=vpc-id,Values=$VPC_ID" "Name=tag:Type,Values=public" \
              --query 'sort_by(Subnets,&AvailabilityZone)[].SubnetId' \
              --output text --region "$REGION" 2>/dev/null | tr '\t' '\n' | grep -v '^$' || true)
            for i in "${!PUB_SUBNETS[@]}"; do
              terraform import "aws_subnet.public[$i]" "${PUB_SUBNETS[$i]}" || true
            done

            readarray -t PRIV_APP < <(aws ec2 describe-subnets \
              --filters "Name=vpc-id,Values=$VPC_ID" "Name=tag:Type,Values=private-app" \
              --query 'sort_by(Subnets,&AvailabilityZone)[].SubnetId' \
              --output text --region "$REGION" 2>/dev/null | tr '\t' '\n' | grep -v '^$' || true)
            for i in "${!PRIV_APP[@]}"; do
              terraform import "aws_subnet.private_app[$i]" "${PRIV_APP[$i]}" || true
            done

            readarray -t PRIV_DB < <(aws ec2 describe-subnets \
              --filters "Name=vpc-id,Values=$VPC_ID" "Name=tag:Type,Values=private-db" \
              --query 'sort_by(Subnets,&AvailabilityZone)[].SubnetId' \
              --output text --region "$REGION" 2>/dev/null | tr '\t' '\n' | grep -v '^$' || true)
            for i in "${!PRIV_DB[@]}"; do
              terraform import "aws_subnet.private_db[$i]" "${PRIV_DB[$i]}" || true
            done

            # NAT Gateways and their Elastic IPs
            # Import each by index using its Name tag (stable mapping regardless of state).
            # This avoids sort-order mismatches and handles any NAT GW state.
            AZ_COUNT=$(aws ec2 describe-availability-zones --region "$REGION" \
              --query 'length(AvailabilityZones)' --output text 2>/dev/null || echo 2)
            # Cap at the configured count (variables.tf default is 2 AZs)
            [ "$AZ_COUNT" -gt 2 ] && AZ_COUNT=2
            for i in $(seq 0 $((AZ_COUNT - 1))); do
              NAT_NAME="${PREFIX}-nat-$((i + 1))"
              NAT_GW_ID=$(aws ec2 describe-nat-gateways \
                --filter "Name=tag:Name,Values=${NAT_NAME}" \
                --query 'NatGateways[?State!=`deleted`&&State!=`failed`]|[0].NatGatewayId' \
                --output text --region "$REGION" 2>/dev/null || true)
              if [ -n "$NAT_GW_ID" ] && [ "$NAT_GW_ID" != "None" ] && [ "$NAT_GW_ID" != "null" ]; then
                terraform import "aws_nat_gateway.main[$i]" "$NAT_GW_ID" || true
                EIP_ALLOC=$(aws ec2 describe-nat-gateways --nat-gateway-ids "$NAT_GW_ID" \
                  --query 'NatGateways[0].NatGatewayAddresses[0].AllocationId' \
                  --output text --region "$REGION" 2>/dev/null || true)
                [ -n "$EIP_ALLOC" ] && [ "$EIP_ALLOC" != "None" ] && [ "$EIP_ALLOC" != "null" ] && \
                  terraform import "aws_eip.nat[$i]" "$EIP_ALLOC" || true
              else
                # NAT GW not found by Name tag – try importing orphaned EIP by tag
                EIP_NAME="${PREFIX}-nat-eip-$((i + 1))"
                EIP_ALLOC=$(aws ec2 describe-addresses \
                  --filters "Name=tag:Name,Values=${EIP_NAME}" \
                  --query 'Addresses[0].AllocationId' \
                  --output text --region "$REGION" 2>/dev/null || true)
                [ -n "$EIP_ALLOC" ] && [ "$EIP_ALLOC" != "None" ] && [ "$EIP_ALLOC" != "null" ] && \
                  terraform import "aws_eip.nat[$i]" "$EIP_ALLOC" || true
              fi
            done

            # Route tables
            PUB_RT=$(aws ec2 describe-route-tables \
              --filters "Name=vpc-id,Values=$VPC_ID" "Name=tag:Name,Values=${PREFIX}-public-rt" \
              --query 'RouteTables[0].RouteTableId' --output text --region "$REGION" 2>/dev/null || true)
            [ -n "$PUB_RT" ] && [ "$PUB_RT" != "None" ] && terraform import aws_route_table.public "$PUB_RT" || true

            readarray -t PRIV_RTS < <(aws ec2 describe-route-tables \
              --filters "Name=vpc-id,Values=$VPC_ID" "Name=tag:Name,Values=${PREFIX}-private-rt-*" \
              --query 'sort_by(RouteTables,&Tags[?Key==`Name`].Value|[0])[].RouteTableId' \
              --output text --region "$REGION" 2>/dev/null | tr '\t' '\n' | grep -v '^$' || true)
            for i in "${!PRIV_RTS[@]}"; do
              terraform import "aws_route_table.private[$i]" "${PRIV_RTS[$i]}" || true
            done

            # Route table associations (format: subnet-id/route-table-id)
            [ -n "$PUB_RT" ] && [ "$PUB_RT" != "None" ] && \
            for i in "${!PUB_SUBNETS[@]}"; do
              terraform import "aws_route_table_association.public[$i]" "${PUB_SUBNETS[$i]}/${PUB_RT}" || true
            done

            for i in "${!PRIV_APP[@]}"; do
              [ -n "${PRIV_RTS[$i]:-}" ] && \
                terraform import "aws_route_table_association.private_app[$i]" "${PRIV_APP[$i]}/${PRIV_RTS[$i]}" || true
            done

            # Security groups
            import_sg() {
              local TF_NAME="$1" SG_NAME="$2"
              local SG_ID
              SG_ID=$(aws ec2 describe-security-groups \
                --filters "Name=vpc-id,Values=$VPC_ID" "Name=group-name,Values=$SG_NAME" \
                --query 'SecurityGroups[0].GroupId' --output text --region "$REGION" 2>/dev/null || true)
              [ -n "$SG_ID" ] && [ "$SG_ID" != "None" ] && terraform import "$TF_NAME" "$SG_ID" || true
            }
            import_sg aws_security_group.alb           "${PREFIX}-alb-sg"
            import_sg aws_security_group.ecs_tasks     "${PREFIX}-ecs-tasks-sg"
            import_sg aws_security_group.rds           "${PREFIX}-rds-sg"
            import_sg aws_security_group.elasticache   "${PREFIX}-elasticache-sg"
            import_sg aws_security_group.lambda        "${PREFIX}-lambda-sg"
            import_sg aws_security_group.vpc_endpoints "${PREFIX}-vpc-endpoints-sg"

            # VPC Endpoints
            import_vpce() {
              local TF_NAME="$1" SVC_NAME="$2"
              local VPCE_ID
              VPCE_ID=$(aws ec2 describe-vpc-endpoints \
                --filters "Name=vpc-id,Values=$VPC_ID" "Name=service-name,Values=$SVC_NAME" \
                          "Name=vpc-endpoint-state,Values=available" \
                --query 'VpcEndpoints[0].VpcEndpointId' --output text --region "$REGION" 2>/dev/null || true)
              [ -n "$VPCE_ID" ] && [ "$VPCE_ID" != "None" ] && terraform import "$TF_NAME" "$VPCE_ID" || true
            }
            import_vpce aws_vpc_endpoint.s3             "com.amazonaws.${REGION}.s3"
            import_vpce aws_vpc_endpoint.ecr_api        "com.amazonaws.${REGION}.ecr.api"
            import_vpce aws_vpc_endpoint.ecr_dkr        "com.amazonaws.${REGION}.ecr.dkr"
            import_vpce aws_vpc_endpoint.logs           "com.amazonaws.${REGION}.logs"
            import_vpce aws_vpc_endpoint.secretsmanager "com.amazonaws.${REGION}.secretsmanager"
          else
            echo "No existing project VPC found – Terraform will create a new one."
            echo "If this fails with VpcLimitExceeded, delete an unused VPC in $REGION."
          fi

          echo "=== Import step complete ==="
          set -e

      - name: Terraform apply
        working-directory: aws/infrastructure
        run: |
          terraform apply -auto-approve -lock=false \
            -var "environment=dev" \
            -var "aws_region=${AWS_REGION}"

      - name: Save Terraform outputs
        working-directory: aws/infrastructure
        run: terraform output -json > tf_outputs.json

      - name: Upload tf outputs
        uses: actions/upload-artifact@v4
        with:
          name: tf-outputs
          path: aws/infrastructure/tf_outputs.json

  verify-deployment:
    name: Wait for ECS service stability
    needs: terraform-apply
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
    steps:
      - name: Download tf outputs
        uses: actions/download-artifact@v4
        with:
          name: tf-outputs
          path: ./tf

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Wait for ECS service to stabilize
        run: |
          CLUSTER=$(jq -r '.ecs_cluster_name.value' ./tf/tf_outputs.json)
          SERVICE="smart-glasses-dev-api-service"
          echo "Waiting for ECS service $SERVICE in cluster $CLUSTER to stabilize (includes DB migrations via MIGRATE_ON_STARTUP)..."
          aws ecs wait services-stable \
            --cluster "$CLUSTER" \
            --services "$SERVICE" \
            --region "$AWS_REGION"
          echo "ECS service is stable."

      - name: Smoke-test health endpoint
        run: |
          ALB=$(jq -r '.api_alb_dns.value' ./tf/tf_outputs.json)
          echo "Health check: http://${ALB}/health"
          for i in $(seq 1 5); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://${ALB}/health" || true)
            echo "Attempt $i: HTTP $STATUS"
            [ "$STATUS" = "200" ] && exit 0
            sleep 15
          done
          echo "Health check did not return 200 after retries"
          exit 1
