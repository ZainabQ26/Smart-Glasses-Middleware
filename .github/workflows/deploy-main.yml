name: Deploy to AWS

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod
      skip_migrations:
        description: 'Skip EF Core migrations (recommended for fresh dev setup)'
        required: false
        default: true
        type: boolean
      force_recreate_dev:
        description: 'DANGER: delete existing dev resources before apply'
        required: false
        default: false
        type: boolean

# Ensure only one deployment runs at a time per branch.
# A newer push cancels any in-progress run so Terraform state is never
# written by two concurrent jobs (which can corrupt state / destroy resources).
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Validates .NET compilation AND builds+pushes the API Docker image.
  # Docker layer caching avoids re-running dotnet restore / npm ci when
  # dependencies are unchanged — typically saves 3-5 minutes per run.
  build-api:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Delete invalid old Actions caches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          REPO="${GITHUB_REPOSITORY}"
          PREFIXES=(
            "Linux-whisper-"
            "Linux-buildx-whisper-"
            "Linux-whisper-Xenova-"
          )

          echo "Scanning Actions caches for invalid legacy keys..."
          for prefix in "${PREFIXES[@]}"; do
            echo "Checking prefix: $prefix"
            IDS=$(gh api "repos/${REPO}/actions/caches" --paginate \
              --jq ".actions_caches[] | select(.key | startswith(\"${prefix}\")) | .id")

            if [ -z "$IDS" ]; then
              echo "  No caches found for prefix $prefix"
              continue
            fi

            for id in $IDS; do
              echo "  Deleting cache id=$id (prefix=$prefix)"
              gh api -X DELETE "repos/${REPO}/actions/caches/${id}" >/dev/null 2>&1 || true
            done
          done

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # Must match terraform/migrations account so pushed image tag exists
          # where ECS tasks run.
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}
          mask-aws-account-id: false

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v1

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names "smart-glasses-dev-api" --region "${{ secrets.AWS_REGION }}" >/dev/null 2>&1 || \
          aws ecr create-repository --repository-name "smart-glasses-dev-api" --image-scanning-configuration scanOnPush=true --region "${{ secrets.AWS_REGION }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # buildx will use the GitHub Actions cache (gha) to avoid storing large
      # layer caches on the runner disk. This reduces ephemeral storage usage.

      - name: Build & push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./src/SmartGlassesMiddleware/Dockerfile
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/smart-glasses-dev-api:${{ github.sha }}
            ${{ steps.ecr-login.outputs.registry }}/smart-glasses-dev-api:latest
          platforms: linux/amd64
          no-cache: true
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Cleanup Docker and build caches
        if: always()
        run: |
          # Clean up buildx cache to avoid storage exhaustion
          rm -rf /tmp/.buildx-cache-new /tmp/.buildx-cache || true
          # Remove all dangling Docker images and build cache
          docker system prune -af --volumes || true
          # Clean up Docker buildx build state
          docker buildx du --verbose || true
          docker buildx prune -af || true
          echo "Docker cleanup complete"

  # Packages the Document Processor Lambda zip. Runs in PARALLEL with build-api — no shared deps.
  # Whisper Lambda removed: audio transcription now handled entirely browser-side via Whisper worker.
  build-lambda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Document Processor Lambda zip
        run: |
          cd aws/lambda-document-processor
          chmod +x build.sh
          ./build.sh

      - name: Clean up Python cache
        if: always()
        run: |
          # Clean up Python and pip caches to save space
          rm -rf ~/.cache/pip ~/.cache/python || true
          find . -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true
          find . -type d -name .pytest_cache -exec rm -rf {} + 2>/dev/null || true
          echo "Python cleanup complete"

      - name: Upload Document Processor zip
        uses: actions/upload-artifact@v4
        with:
          name: lambda-document-zip
          path: aws/lambda-document-processor/deployment.zip
          retention-days: 1

  terraform-apply:
    needs: [build-api, build-lambda]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      TF_VAR_groq_api_key: ${{ secrets.GROQ_API_KEY }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}
          # Required so aws sts get-caller-identity returns the account ID unmasked
          mask-aws-account-id: false

      - name: Guardrail for prod deploy input
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod' }}
        run: |
          echo "Prod deploy selected via workflow_dispatch."
          if [[ "${GITHUB_REF_TYPE}" != "tag" || "${GITHUB_REF_NAME}" != v* ]]; then
            echo "❌ Blocked: prod deploy requires a version tag (v*)."
            echo "Create/push a v* tag and use that flow for prod deployments."
            exit 1
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.7

      - name: Destroy existing dev resources (best-effort, non-fatal)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev' && github.event.inputs.force_recreate_dev == 'true' }}
        run: |
          set -e
          REGION=${AWS_REGION}
          ENV=dev
          PREFIX="smart-glasses-${ENV}"

          echo "Starting best-effort deletion of existing resources with prefix ${PREFIX} in ${REGION}"

          # non-fatal deletions
          set +e

          # NOTE: ECR repository is intentionally NOT deleted here.
          # The build-api job pushes the image before this job runs, so
          # deleting the ECR repo would destroy the image and cause ECS to
          # fail with CannotPullContainerError. Terraform will import and
          # manage the existing repo in the subsequent import step.

          # KMS aliases
          for a in "alias/${PREFIX}-ecr" "alias/${PREFIX}-rds" "alias/${PREFIX}-s3"; do
            aws kms list-aliases --region "$REGION" --query "Aliases[?AliasName=='$a']" --output text >/dev/null 2>&1 && aws kms delete-alias --alias-name "$a" --region "$REGION" || true
          done

          # NOTE: CloudFront OAC and origin request policy are NOT deleted here.
          # They cannot be deleted while associated with a CloudFront distribution.
          # They are handled via terraform import in the import step below.

          # CloudWatch Log Groups (examples from logs)
          aws logs delete-log-group --log-group-name "/ecs/${PREFIX}/api" --region "$REGION" || true
          aws logs delete-log-group --log-group-name "/aws/elasticache/${PREFIX}/slow-log" --region "$REGION" || true
          aws logs delete-log-group --log-group-name "/aws/elasticache/${PREFIX}/engine-log" --region "$REGION" || true
          aws logs delete-log-group --log-group-name "/aws/lambda/${PREFIX}-document-processor" --region "$REGION" || true

          # IAM roles and policies (detach and delete)
          delete_role() {
            RNAME="$1"
            ARN=$(aws iam get-role --role-name "$RNAME" --query 'Role.Arn' --output text 2>/dev/null || true)
            if [ -n "$ARN" ]; then
              # detach managed policies
              for p in $(aws iam list-attached-role-policies --role-name "$RNAME" --query 'AttachedPolicies[].PolicyArn' --output text 2>/dev/null || true); do
                aws iam detach-role-policy --role-name "$RNAME" --policy-arn "$p" || true
              done
              # delete inline policies
              for ip in $(aws iam list-role-policies --role-name "$RNAME" --query 'PolicyNames[]' --output text 2>/dev/null || true); do
                aws iam delete-role-policy --role-name "$RNAME" --policy-name "$ip" || true
              done
              aws iam delete-role --role-name "$RNAME" || true
            fi
          }

          delete_role "${PREFIX}-ecs-task-execution-role"
          delete_role "${PREFIX}-ecs-task-role"
          delete_role "${PREFIX}-lambda-doc-processor-role"
          delete_role "${PREFIX}-rds-monitoring-role"
          delete_role "${PREFIX}-whisper-exec"

          # IAM policies by name
          for pname in "${PREFIX}-whisper-s3-access" "${PREFIX}-whisper-allow-sqs-send"; do
            POL_ARN=$(aws iam list-policies --scope Local --query "Policies[?PolicyName=='$pname'].Arn" --output text 2>/dev/null || true)
            if [ -n "$POL_ARN" ]; then aws iam delete-policy --policy-arn "$POL_ARN" || true; fi
          done

          # NOTE: ElastiCache parameter group and RDS cluster parameter group are NOT
          # deleted here. They cannot be deleted while their clusters/replication groups
          # still exist. They are handled via terraform import in the import step.
          # NOTE: VPC is NOT deleted here. The VPC will be imported so Terraform manages
          # the existing one rather than trying to create a new one (which would exceed
          # the account's VPC limit if 5 VPCs already exist).

          set -e

          echo "Best-effort deletion complete."

      - name: Write image variables for Terraform
        run: |
          set -euo pipefail

          # Derive the ECR registry from STS (not from a secret, so values are never masked)
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          REPOSITORY="smart-glasses-dev-api"
          SHA="${{ github.sha }}"
          IMAGE_URI="${REGISTRY}/${REPOSITORY}:${SHA}"

          # Guard against stale/missing image tags so Terraform never updates ECS
          # to a non-existent image (which would make the backend unavailable).
          if aws ecr describe-images \
            --repository-name "$REPOSITORY" \
            --image-ids imageTag="$SHA" \
            --region "$AWS_REGION" >/dev/null 2>&1; then
            SELECTED_IMAGE="$IMAGE_URI"
          else
            echo "::warning::Image tag $SHA not found in ECR; falling back to currently running ECS image."

            CLUSTER="smart-glasses-dev-cluster"
            SERVICE="smart-glasses-dev-api-service"
            TASK_DEF_ARN=$(aws ecs describe-services \
              --cluster "$CLUSTER" \
              --services "$SERVICE" \
              --region "$AWS_REGION" \
              --query 'services[0].taskDefinition' \
              --output text 2>/dev/null || true)

            if [ -z "$TASK_DEF_ARN" ] || [ "$TASK_DEF_ARN" = "None" ] || [ "$TASK_DEF_ARN" = "null" ]; then
              echo "Unable to resolve running ECS task definition for fallback image."
              exit 1
            fi

            FALLBACK_IMAGE=$(aws ecs describe-task-definition \
              --task-definition "$TASK_DEF_ARN" \
              --region "$AWS_REGION" \
              --query 'taskDefinition.containerDefinitions[?name==`api`].image | [0]' \
              --output text 2>/dev/null || true)

            if [ -z "$FALLBACK_IMAGE" ] || [ "$FALLBACK_IMAGE" = "None" ] || [ "$FALLBACK_IMAGE" = "null" ]; then
              echo "Unable to resolve fallback image from ECS task definition $TASK_DEF_ARN."
              exit 1
            fi

            SELECTED_IMAGE="$FALLBACK_IMAGE"
            echo "Using fallback image: $SELECTED_IMAGE"
          fi

          cat > aws/infrastructure/tf_image_vars.auto.tfvars <<EOF
          api_image = "${SELECTED_IMAGE}"
          deployment_id = "${{ github.run_id }}"
          EOF

      - name: Download Document Processor zip
        uses: actions/download-artifact@v4
        with:
          name: lambda-document-zip
          path: .

      - name: Place Document Processor zip into terraform path
        run: |
          mkdir -p aws/lambda-document-processor
          if [ -f aws/lambda-document-processor/deployment.zip ]; then
            echo "deployment.zip already in place"
          elif [ -f deployment.zip ]; then
            mv deployment.zip aws/lambda-document-processor/deployment.zip
            echo "moved deployment.zip to aws/lambda-document-processor/deployment.zip"
          else
            echo "No deployment.zip found after download";
            ls -la || true;
            exit 1
          fi

      - name: Upload Lambda deployment zip to S3
        run: |
          set -euo pipefail
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET_NAME="smart-glasses-terraform-state-${ACCOUNT_ID}-dev"
          # Fixed key — every deploy overwrites the same object so the bucket never accumulates old zips.
          S3_KEY="lambda-deployments/document-processor/deployment.zip"
          echo "Uploading deployment.zip to s3://${BUCKET_NAME}/${S3_KEY}"
          aws s3 cp aws/lambda-document-processor/deployment.zip "s3://${BUCKET_NAME}/${S3_KEY}"
          # Compute base64-encoded SHA-256 so Terraform can detect code changes via source_code_hash.
          HASH=$(openssl dgst -sha256 -binary aws/lambda-document-processor/deployment.zip | base64)
          # Append S3 deployment vars so Terraform uses S3 instead of a local file.
          cat >> aws/infrastructure/tf_image_vars.auto.tfvars <<EOF
          lambda_deployment_s3_bucket = "${BUCKET_NAME}"
          lambda_deployment_s3_key    = "${S3_KEY}"
          lambda_deployment_hash      = "${HASH}"
          EOF

      - name: Delete lambda-document-zip artifact (cleanup)
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "Looking up artifact ids for lambda-document-zip..."
          PAGE=1
          while :; do
            RESP=$(curl -s -H "Authorization: token $GH_TOKEN" "https://api.github.com/repos/${REPO}/actions/artifacts?per_page=100&page=${PAGE}") || true
            COUNT=$(echo "$RESP" | jq '.artifacts | length')
            if [ "$COUNT" -eq 0 ]; then
              break
            fi
            IDS=$(echo "$RESP" | jq -r '.artifacts[] | select(.name=="lambda-document-zip") | .id') || true
            if [ -n "${IDS:-}" ]; then
              for id in $IDS; do
                echo "Deleting artifact id=$id"
                curl -s -X DELETE -H "Authorization: token $GH_TOKEN" "https://api.github.com/repos/${REPO}/actions/artifacts/${id}" || true
              done
            fi
            PAGE=$((PAGE+1))
          done
          echo "lambda-document-zip cleanup complete."

      - name: Patch IAM role with application-autoscaling permission
        run: |
          ROLE_NAME="github-actions-terraform"
          POLICY_NAME="autoscaling-supplement"
          # Idempotent: attaches an inline policy granting application-autoscaling:*
          # This is needed for aws_appautoscaling_target in ecs.tf which calls
          # application-autoscaling:RegisterScalableTarget during terraform apply.
          aws iam put-role-policy \
            --role-name "$ROLE_NAME" \
            --policy-name "$POLICY_NAME" \
            --policy-document '{"Version":"2012-10-17","Statement":[{"Sid":"AppAutoScaling","Effect":"Allow","Action":["application-autoscaling:*"],"Resource":"*"},{"Sid":"CloudWatchAlarms","Effect":"Allow","Action":["cloudwatch:PutMetricAlarm","cloudwatch:DeleteAlarms","cloudwatch:DescribeAlarms","cloudwatch:DescribeAlarmsForMetric","cloudwatch:EnableAlarmActions","cloudwatch:DisableAlarmActions","cloudwatch:ListTagsForResource","cloudwatch:TagResource","cloudwatch:UntagResource"],"Resource":"*"},{"Sid":"EventBridge","Effect":"Allow","Action":["events:PutRule","events:PutTargets","events:DeleteRule","events:RemoveTargets","events:DescribeRule","events:ListTargetsByRule","events:ListRuleNamesByTarget","events:TagResource","events:UntagResource","events:ListTagsForResource"],"Resource":"*"},{"Sid":"Route53","Effect":"Allow","Action":["route53:ListHostedZones","route53:GetHostedZone","route53:ChangeResourceRecordSets","route53:ListResourceRecordSets","route53:GetChange","route53:ListTagsForResource"],"Resource":"*"},{"Sid":"ACM","Effect":"Allow","Action":["acm:RequestCertificate","acm:DescribeCertificate","acm:DeleteCertificate","acm:ListCertificates","acm:AddTagsToCertificate","acm:ListTagsForCertificate","acm:GetCertificate"],"Resource":"*"}]}' \
            2>/dev/null || echo "Warning: could not patch IAM role $ROLE_NAME (may not exist or lack permission)"

      - name: Terraform init
        working-directory: aws/infrastructure
        run: |
          # Create S3 backend bucket (us-east-1 must NOT use --create-bucket-configuration)
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET_NAME="smart-glasses-terraform-state-${ACCOUNT_ID}-dev"
          DDB_NAME="smart-glasses-terraform-locks-${ACCOUNT_ID}-dev"
          aws s3api head-bucket --bucket "$BUCKET_NAME" --region "$AWS_REGION" >/dev/null 2>&1 || (
            if [ "$AWS_REGION" = "us-east-1" ]; then
              aws s3api create-bucket --bucket "$BUCKET_NAME" --region "$AWS_REGION" || true
            else
              aws s3api create-bucket --bucket "$BUCKET_NAME" --region "$AWS_REGION" --create-bucket-configuration LocationConstraint=$AWS_REGION || true
            fi
          )
          aws dynamodb describe-table --table-name "$DDB_NAME" --region "$AWS_REGION" >/dev/null 2>&1 || aws dynamodb create-table --table-name "$DDB_NAME" --attribute-definitions AttributeName=LockID,AttributeType=S --key-schema AttributeName=LockID,KeyType=HASH --billing-mode PAY_PER_REQUEST --region "$AWS_REGION" || true

          # Force-release any stale lock left by a previous failed run.
          # CI runs are sequential, so this is safe.
          aws dynamodb delete-item \
            --table-name "$DDB_NAME" \
            --key "{\"LockID\":{\"S\":\"${BUCKET_NAME}/state/terraform.tfstate\"}}" \
            --region "$AWS_REGION" 2>/dev/null || true

          # Remove old local state files and initialize with S3 backend
          rm -rf .terraform.lock.hcl terraform.tfstate* 2>/dev/null || true
          terraform init -backend-config="bucket=${BUCKET_NAME}" -backend-config="key=state/terraform.tfstate" -backend-config="region=${AWS_REGION}" -backend-config="dynamodb_table=${DDB_NAME}"

      - name: Import pre-existing resources into Terraform state
        if: ${{ !(github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev' && github.event.inputs.force_recreate_dev == 'true') }}
        timeout-minutes: 20
        working-directory: aws/infrastructure
        run: |
          set +e
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REGION="${AWS_REGION}"
          ENV=dev
          PREFIX="smart-glasses-${ENV}"

          echo "=== Importing pre-existing AWS resources ==="

          # Fetch the full state list once so safe_import can check membership
          # with a fast grep instead of an individual round-trip per resource.
          echo "  Fetching Terraform state list..."
          EXISTING_STATE=$(terraform state list -lock=false 2>/dev/null || echo "")

          # safe_import: skip if already in TF state (avoids "Resource already
          # managed by Terraform" abort).  Used for global/stable resources.
          safe_import() {
            local TF_RES="$1" IMPORT_ID="$2"
            [ -z "$IMPORT_ID" ] || [ "$IMPORT_ID" = "None" ] || [ "$IMPORT_ID" = "null" ] && return 0
            if echo "$EXISTING_STATE" | grep -qxF "$TF_RES"; then
              echo "  Already in state: $TF_RES (skipping)"
            else
              terraform import -lock=false "$TF_RES" "$IMPORT_ID" || true
              EXISTING_STATE="${EXISTING_STATE}${NEWLINE}${TF_RES}"
            fi
          }
          NEWLINE=$'\n'

          # tf_import: always state rm then import.  Used for ALL VPC sub-resources
          # so stale wrong-VPC entries are always replaced with the correct one.
          tf_import() {
            local TF_RES="$1" IMPORT_ID="$2"
            [ -z "$IMPORT_ID" ] || [ "$IMPORT_ID" = "None" ] || [ "$IMPORT_ID" = "null" ] && return 0
            terraform state rm -lock=false "$TF_RES" 2>/dev/null || true
            # Invalidate in-memory cache so the resource is not skipped if safe_import
            # is called for it later in the same run.
            EXISTING_STATE=$(printf '%s\n' "$EXISTING_STATE" | grep -vxF "$TF_RES" || true)
            terraform import -lock=false "$TF_RES" "$IMPORT_ID" || true
            EXISTING_STATE="${EXISTING_STATE}${NEWLINE}${TF_RES}"
          }

          # ── Remove old Aurora resources from state (migrated to standard RDS) ─
          # These resource types no longer exist in the Terraform config.
          # Removing them upfront prevents Terraform planning a destroy action.
          echo "Cleaning up old Aurora state entries (if any)..."
          for OLD_RES in \
            aws_rds_cluster_parameter_group.main \
            aws_rds_cluster.main \
            "aws_rds_cluster_instance.main[0]" \
            "aws_rds_cluster_instance.main[1]"; do
            terraform state rm -lock=false "$OLD_RES" 2>/dev/null && echo "  Removed $OLD_RES from state" || true
          done

          # ── S3 (data must never be destroyed) ─────────────────────────────────
          safe_import aws_s3_bucket.media     "${PREFIX}-media"
          safe_import aws_s3_bucket.documents "${PREFIX}-documents"
          safe_import aws_s3_bucket.frontend  "${PREFIX}-frontend"

          # ── KMS ───────────────────────────────────────────────────────────────
          KMS_S3=$(aws kms describe-key --key-id "alias/${PREFIX}-s3"  --query 'KeyMetadata.KeyId' --output text 2>/dev/null || true)
          KMS_RDS=$(aws kms describe-key --key-id "alias/${PREFIX}-rds" --query 'KeyMetadata.KeyId' --output text 2>/dev/null || true)
          safe_import aws_kms_key.s3  "$KMS_S3"
          safe_import aws_kms_key.rds "$KMS_RDS"
          safe_import aws_kms_alias.s3  "alias/${PREFIX}-s3"
          safe_import aws_kms_alias.rds "alias/${PREFIX}-rds"

          # ── Secrets Manager (resolve full ARN incl. random suffix) ────────────
          import_secret() {
            local TF_RES="$1" SECRET_NAME="$2"
            local ARN
            ARN=$(aws secretsmanager describe-secret --secret-id "$SECRET_NAME" \
              --query 'ARN' --output text --region "$REGION" 2>/dev/null || true)
            safe_import "$TF_RES" "$ARN"
          }
          import_secret aws_secretsmanager_secret.db_credentials    "${PREFIX}-db-credentials"
          # app_secrets is now prod-only. Ensure stale dev state is removed.
          if [ "$ENV" = "dev" ]; then
            terraform state rm -lock=false "aws_secretsmanager_secret.app_secrets" 2>/dev/null || true
            terraform state rm -lock=false "aws_secretsmanager_secret.app_secrets[0]" 2>/dev/null || true
            terraform state rm -lock=false "aws_secretsmanager_secret_version.app_secrets" 2>/dev/null || true
            terraform state rm -lock=false "aws_secretsmanager_secret_version.app_secrets[0]" 2>/dev/null || true
            EXISTING_STATE=$(printf '%s\n' "$EXISTING_STATE" | grep -vxF "aws_secretsmanager_secret.app_secrets" || true)
            EXISTING_STATE=$(printf '%s\n' "$EXISTING_STATE" | grep -vxF "aws_secretsmanager_secret.app_secrets[0]" || true)
            EXISTING_STATE=$(printf '%s\n' "$EXISTING_STATE" | grep -vxF "aws_secretsmanager_secret_version.app_secrets" || true)
            EXISTING_STATE=$(printf '%s\n' "$EXISTING_STATE" | grep -vxF "aws_secretsmanager_secret_version.app_secrets[0]" || true)
          else
            import_secret "aws_secretsmanager_secret.app_secrets[0]" "${PREFIX}-app-secrets"
          fi
          # redis_credentials count=0 for dev (cost_optimized_non_prod=true disables redis).
          # Importing it would leave a count=0 resource in state, causing a
          # prevent_destroy-blocked destroy on apply. Remove from state instead.
          if [ "$ENV" = "dev" ]; then
            terraform state rm -lock=false "aws_secretsmanager_secret.redis_credentials[0]" 2>/dev/null || true
            EXISTING_STATE=$(printf '%s\n' "$EXISTING_STATE" | grep -vxF "aws_secretsmanager_secret.redis_credentials[0]" || true)
          else
            import_secret aws_secretsmanager_secret.redis_credentials "${PREFIX}-redis-credentials"
          fi

          # ── CloudFront ────────────────────────────────────────────────────────
          OAC_ID=$(aws cloudfront list-origin-access-controls \
            --query "OriginAccessControlList.Items[?Name=='${PREFIX}-frontend-oac'].Id" \
            --output text 2>/dev/null || true)
          safe_import aws_cloudfront_origin_access_control.frontend "$OAC_ID"
          ORP_ID=$(aws cloudfront list-origin-request-policies --type custom \
            --query "OriginRequestPolicyList.Items[?OriginRequestPolicy.OriginRequestPolicyConfig.Name=='${PREFIX}-api-policy'].OriginRequestPolicy.Id" \
            --output text 2>/dev/null | tr '\t' '\n' | grep -v '^$' | head -1 || true)
          safe_import aws_cloudfront_origin_request_policy.api "$ORP_ID"

          # Import the CloudFront distribution if it exists but is not yet in state.
          # Finds the single enabled http-only ALB-API distribution managed by Terraform.
          CF_DIST_ID=$(aws cloudfront list-distributions --output json 2>/dev/null | \
            jq -r '.DistributionList.Items[] | select(.Enabled == true) | select(.Origins.Items[] | select(.Id == "ALB-API") | .CustomOriginConfig.OriginProtocolPolicy == "http-only") | .Id' 2>/dev/null \
            | head -1 || true)
          echo "  CloudFront distribution (http-only): ${CF_DIST_ID:-none found}"
          safe_import aws_cloudfront_distribution.frontend "$CF_DIST_ID"

          # ── ElastiCache ───────────────────────────────────────────────────────
          # If the replication group or cluster no longer exists in AWS (e.g. was
          # destroyed in a previous run), remove the stale Terraform state entries
          # so Terraform plans a create rather than failing with CacheClusterNotFound.
          REDIS_CLUSTER_EXISTS=$(aws elasticache describe-cache-clusters \
            --cache-cluster-id "${PREFIX}-redis-single" \
            --query 'CacheClusters[0].CacheClusterId' --output text 2>/dev/null || true)
          if [ -z "$REDIS_CLUSTER_EXISTS" ] || [ "$REDIS_CLUSTER_EXISTS" = "None" ]; then
            echo "  ElastiCache cluster not found in AWS — removing stale state entries"
            terraform state rm -lock=false "aws_elasticache_cluster.redis_single[0]"        2>/dev/null || true
            terraform state rm -lock=false "aws_elasticache_replication_group.redis[0]"     2>/dev/null || true
            terraform state rm -lock=false aws_elasticache_replication_group.redis           2>/dev/null || true
            terraform state rm -lock=false "aws_elasticache_subnet_group.main[0]"            2>/dev/null || true
            terraform state rm -lock=false "aws_elasticache_parameter_group.redis[0]"        2>/dev/null || true
            # Invalidate in-memory cache for all rm'd resources so safe_import
            # correctly re-imports them instead of skipping them.
            for _rmres in \
              "aws_elasticache_cluster.redis_single[0]" \
              "aws_elasticache_replication_group.redis[0]" \
              "aws_elasticache_replication_group.redis" \
              "aws_elasticache_subnet_group.main[0]" \
              "aws_elasticache_parameter_group.redis[0]"; do
              EXISTING_STATE=$(printf '%s\n' "$EXISTING_STATE" | grep -vxF "$_rmres" || true)
            done
          fi
          # For dev: replication group has count=0 always (its count expr uses != "dev").
          # Remove any previously-imported entry to prevent a prevent_destroy conflict.
          if [ "$ENV" = "dev" ]; then
            terraform state rm -lock=false "aws_elasticache_replication_group.redis[0]" 2>/dev/null || true
            EXISTING_STATE=$(printf '%s\n' "$EXISTING_STATE" | grep -vxF "aws_elasticache_replication_group.redis[0]" || true)
          fi
          safe_import "aws_elasticache_parameter_group.redis[0]"   "${PREFIX}-redis-params"
          safe_import "aws_elasticache_subnet_group.main[0]"       "${PREFIX}-elasticache-subnet-group"
          # Only import the replication group for non-dev envs (count>0 only outside dev)
          [ "$ENV" != "dev" ] && safe_import "aws_elasticache_replication_group.redis[0]" "${PREFIX}-redis"
          safe_import "aws_elasticache_cluster.redis_single[0]" "${PREFIX}-redis-single"

          # ── RDS ───────────────────────────────────────────────────────────────
          safe_import aws_db_subnet_group.main      "${PREFIX}-db-subnet-group"
          safe_import aws_db_parameter_group.main   "${PREFIX}-pg16-params"
          safe_import aws_db_instance.main          "${PREFIX}-postgres"
          echo "ENABLE_RDS=true" >> "$GITHUB_ENV"

          # ── ALB, Listeners, Target Group ──────────────────────────────────────
          ALB_ARN=$(aws elbv2 describe-load-balancers --names "${PREFIX}-api-alb" \
            --query 'LoadBalancers[0].LoadBalancerArn' --output text --region "$REGION" 2>/dev/null || true)
          safe_import aws_lb.api "$ALB_ARN"

          TG_ARN=""
          if [ -n "$ALB_ARN" ] && [ "$ALB_ARN" != "None" ]; then
            HTTP_LISTENER=$(aws elbv2 describe-listeners \
              --load-balancer-arn "$ALB_ARN" \
              --query 'Listeners[?Port==`80`].ListenerArn' \
              --output text --region "$REGION" 2>/dev/null || true)
            safe_import aws_lb_listener.api_http "$HTTP_LISTENER"
            if [ -n "$HTTP_LISTENER" ] && [ "$HTTP_LISTENER" != "None" ]; then
              TG_ARN=$(aws elbv2 describe-listeners \
                --listener-arns "$HTTP_LISTENER" \
                --query 'Listeners[0].DefaultActions[?Type==`forward`].TargetGroupArn|[0]' \
                --output text --region "$REGION" 2>/dev/null || true)
            fi
            HTTPS_LISTENER=$(aws elbv2 describe-listeners \
              --load-balancer-arn "$ALB_ARN" \
              --query 'Listeners[?Port==`443`].ListenerArn' \
              --output text --region "$REGION" 2>/dev/null || true)
            safe_import aws_lb_listener.api_https "$HTTPS_LISTENER"
          fi
          # Fallback TG lookup by name if listener had no forward action
          if [ -z "$TG_ARN" ] || [ "$TG_ARN" = "None" ]; then
            TG_ARN=$(aws elbv2 describe-target-groups --names "${PREFIX}-api-tg" \
              --query 'TargetGroups[0].TargetGroupArn' --output text --region "$REGION" 2>/dev/null || true)
          fi
          # TG always uses tf_import so the ALB-associated ARN is guaranteed in state
          tf_import aws_lb_target_group.api "$TG_ARN"

          # ── ECS ───────────────────────────────────────────────────────────────
          ECS_CLUSTER="${PREFIX}-cluster"
          safe_import aws_ecs_cluster.main "$ECS_CLUSTER"
          safe_import aws_ecs_service.api  "${ECS_CLUSTER}/${PREFIX}-api-service"

          # ── Lambda wake permissions (Function URL) ───────────────────────────
          # These statements may already exist if they were added manually to
          # hotfix wake-up behavior. Import them so terraform apply does not hit
          # ResourceConflictException (statement id already exists).
          WAKE_LAMBDA_NAME="${PREFIX}-ecs-idle-scaler"
          safe_import "aws_lambda_permission.allow_function_url_public[0]" "${WAKE_LAMBDA_NAME}/FunctionURLAllowPublicAccess"
          safe_import "aws_lambda_permission.allow_function_url_invoke[0]" "${WAKE_LAMBDA_NAME}/FunctionURLAllowInvokeFunction"

          # ── VPC and all sub-resources ─────────────────────────────────────────
          # Use the ALB's VPC as authoritative so all sub-resources land in the
          # correct VPC.  tf_import is used throughout so any stale wrong-VPC
          # entries are always evicted and replaced.
          ALB_VPC_ID=$(aws elbv2 describe-load-balancers --names "${PREFIX}-api-alb" \
            --query 'LoadBalancers[0].VpcId' --output text --region "$REGION" 2>/dev/null || true)
          if [ -n "$ALB_VPC_ID" ] && [ "$ALB_VPC_ID" != "None" ]; then
            VPC_ID="$ALB_VPC_ID"
            echo "Authoritative VPC (from ALB): $VPC_ID"
          else
            VPC_ID=$(aws ec2 describe-vpcs \
              --filters "Name=tag:Name,Values=${PREFIX}-vpc" \
              --query 'Vpcs[0].VpcId' --output text --region "$REGION" 2>/dev/null || true)
            if [ -n "$VPC_ID" ] && [ "$VPC_ID" != "None" ] && [ "$VPC_ID" != "null" ]; then
              echo "ALB not found; Name-tag VPC lookup: $VPC_ID"
            else
              VPC_ID=$(aws ec2 describe-vpcs \
              --filters "Name=tag:Project,Values=SmartGlassesMiddleware" "Name=tag:Environment,Values=${ENV}" \
              --query 'Vpcs[0].VpcId' --output text --region "$REGION" 2>/dev/null || true)
              echo "ALB not found; legacy tag-based VPC lookup: $VPC_ID"
            fi
          fi

          if [ -n "$VPC_ID" ] && [ "$VPC_ID" != "None" ]; then
            tf_import aws_vpc.main "$VPC_ID"

            IGW_ID=$(aws ec2 describe-internet-gateways \
              --filters "Name=attachment.vpc-id,Values=$VPC_ID" \
              --query 'InternetGateways[0].InternetGatewayId' --output text --region "$REGION" 2>/dev/null || true)
            tf_import aws_internet_gateway.main "$IGW_ID"

            find_subnet_id() {
              local NAME_TAG="$1" TYPE_TAG="$2" CIDR_BLOCK="$3"
              local SUBNET_ID
              SUBNET_ID=$(aws ec2 describe-subnets \
                --filters "Name=vpc-id,Values=$VPC_ID" "Name=tag:Name,Values=$NAME_TAG" \
                --query 'Subnets[0].SubnetId' --output text --region "$REGION" 2>/dev/null || true)
              if [ -z "$SUBNET_ID" ] || [ "$SUBNET_ID" = "None" ] || [ "$SUBNET_ID" = "null" ]; then
                SUBNET_ID=$(aws ec2 describe-subnets \
                  --filters "Name=vpc-id,Values=$VPC_ID" "Name=tag:Type,Values=$TYPE_TAG" "Name=cidr-block,Values=$CIDR_BLOCK" \
                  --query 'Subnets[0].SubnetId' --output text --region "$REGION" 2>/dev/null || true)
              fi
              if [ -z "$SUBNET_ID" ] || [ "$SUBNET_ID" = "None" ] || [ "$SUBNET_ID" = "null" ]; then
                SUBNET_ID=$(aws ec2 describe-subnets \
                  --filters "Name=vpc-id,Values=$VPC_ID" "Name=cidr-block,Values=$CIDR_BLOCK" \
                  --query 'Subnets[0].SubnetId' --output text --region "$REGION" 2>/dev/null || true)
              fi
              echo "$SUBNET_ID"
            }

            PUB_SUBNETS=()
            PRIV_APP=()
            PRIV_DB=()
            for i in 0 1; do
              PUB_ID=$(find_subnet_id "${PREFIX}-public-$((i + 1))" "public" "10.0.${i}.0/24")
              if [ -n "$PUB_ID" ] && [ "$PUB_ID" != "None" ] && [ "$PUB_ID" != "null" ]; then
                PUB_SUBNETS[$i]="$PUB_ID"
                tf_import "aws_subnet.public[$i]" "$PUB_ID"
              fi

              PRIV_APP_ID=$(find_subnet_id "${PREFIX}-private-app-$((i + 1))" "private-app" "10.0.$((i + 10)).0/24")
              if [ -n "$PRIV_APP_ID" ] && [ "$PRIV_APP_ID" != "None" ] && [ "$PRIV_APP_ID" != "null" ]; then
                PRIV_APP[$i]="$PRIV_APP_ID"
                tf_import "aws_subnet.private_app[$i]" "$PRIV_APP_ID"
              fi

              PRIV_DB_ID=$(find_subnet_id "${PREFIX}-private-db-$((i + 1))" "private-db" "10.0.$((i + 20)).0/24")
              if [ -n "$PRIV_DB_ID" ] && [ "$PRIV_DB_ID" != "None" ] && [ "$PRIV_DB_ID" != "null" ]; then
                PRIV_DB[$i]="$PRIV_DB_ID"
                tf_import "aws_subnet.private_db[$i]" "$PRIV_DB_ID"
              fi
            done

            for i in 0 1; do
              NAT_NAME="${PREFIX}-nat-$((i + 1))"
              NAT_GW_ID=$(aws ec2 describe-nat-gateways \
                --filter "Name=tag:Name,Values=${NAT_NAME}" \
                --query 'NatGateways[?State!=`deleted`&&State!=`failed`]|[0].NatGatewayId' \
                --output text --region "$REGION" 2>/dev/null || true)
              if [ -z "$NAT_GW_ID" ] || [ "$NAT_GW_ID" = "None" ] || [ "$NAT_GW_ID" = "null" ]; then
                EIP_ALLOC=$(aws ec2 describe-addresses \
                  --filters "Name=tag:Name,Values=${PREFIX}-nat-eip-$((i + 1))" \
                  --query 'Addresses[0].AllocationId' \
                  --output text --region "$REGION" 2>/dev/null || true)
                if [ -n "$EIP_ALLOC" ] && [ "$EIP_ALLOC" != "None" ] && [ "$EIP_ALLOC" != "null" ]; then
                  tf_import "aws_eip.nat[$i]" "$EIP_ALLOC"
                  NAT_GW_ID=$(aws ec2 describe-nat-gateways \
                    --filter "Name=vpc-id,Values=$VPC_ID" \
                    --query "NatGateways[?NatGatewayAddresses[?AllocationId=='${EIP_ALLOC}']&&State!='deleted'&&State!='failed']|[0].NatGatewayId" \
                    --output text --region "$REGION" 2>/dev/null || true)
                fi
              fi
              if [ -n "$NAT_GW_ID" ] && [ "$NAT_GW_ID" != "None" ] && [ "$NAT_GW_ID" != "null" ]; then
                tf_import "aws_nat_gateway.main[$i]" "$NAT_GW_ID"
                EIP_ALLOC=$(aws ec2 describe-nat-gateways --nat-gateway-ids "$NAT_GW_ID" \
                  --query 'NatGateways[0].NatGatewayAddresses[0].AllocationId' \
                  --output text --region "$REGION" 2>/dev/null || true)
                tf_import "aws_eip.nat[$i]" "$EIP_ALLOC"
              fi
            done

            PUB_RT=$(aws ec2 describe-route-tables \
              --filters "Name=vpc-id,Values=$VPC_ID" "Name=tag:Name,Values=${PREFIX}-public-rt" \
              --query 'RouteTables[0].RouteTableId' --output text --region "$REGION" 2>/dev/null || true)
            tf_import aws_route_table.public "$PUB_RT"

            readarray -t PRIV_RTS < <(aws ec2 describe-route-tables \
              --filters "Name=vpc-id,Values=$VPC_ID" "Name=tag:Name,Values=${PREFIX}-private-rt-*" \
              --query 'sort_by(RouteTables,&Tags[?Key==`Name`].Value|[0])[].RouteTableId' \
              --output text --region "$REGION" 2>/dev/null | tr '\t' '\n' | grep -v '^$' || true)
            for i in "${!PRIV_RTS[@]}"; do
              tf_import "aws_route_table.private[$i]" "${PRIV_RTS[$i]}"
            done

            if [ -n "$PUB_RT" ] && [ "$PUB_RT" != "None" ]; then
              for i in "${!PUB_SUBNETS[@]}"; do
                tf_import "aws_route_table_association.public[$i]" "${PUB_SUBNETS[$i]}/${PUB_RT}"
              done
            fi
            for i in "${!PRIV_APP[@]}"; do
              [ -n "${PRIV_RTS[$i]:-}" ] && \
                tf_import "aws_route_table_association.private_app[$i]" "${PRIV_APP[$i]}/${PRIV_RTS[$i]}"
            done

            import_sg() {
              local TF_NAME="$1" SG_NAME="$2"
              local SG_ID
              SG_ID=$(aws ec2 describe-security-groups \
                --filters "Name=vpc-id,Values=$VPC_ID" "Name=group-name,Values=$SG_NAME" \
                --query 'SecurityGroups[0].GroupId' --output text --region "$REGION" 2>/dev/null || true)
              tf_import "$TF_NAME" "$SG_ID"
            }
            import_sg aws_security_group.alb           "${PREFIX}-alb-sg"
            import_sg aws_security_group.ecs_tasks     "${PREFIX}-ecs-tasks-sg"
            import_sg aws_security_group.rds           "${PREFIX}-rds-sg"
            import_sg aws_security_group.elasticache   "${PREFIX}-elasticache-sg"
            import_sg aws_security_group.lambda        "${PREFIX}-lambda-sg"
            import_sg aws_security_group.vpc_endpoints "${PREFIX}-vpc-endpoints-sg"

            import_vpce() {
              local TF_NAME="$1" SVC_NAME="$2"
              local VPCE_ID
              VPCE_ID=$(aws ec2 describe-vpc-endpoints \
                --filters "Name=vpc-id,Values=$VPC_ID" "Name=service-name,Values=$SVC_NAME" \
                          "Name=vpc-endpoint-state,Values=available" \
                --query 'VpcEndpoints[0].VpcEndpointId' --output text --region "$REGION" 2>/dev/null || true)
              echo "  VPCE $SVC_NAME → ${VPCE_ID:-<not found in VPC>}"
              # Use safe_import (not tf_import) so an existing state entry is never
              # removed then silently fails to re-import, which leaves the resource
              # out of state and causes "conflicting DNS domain" on apply.
              safe_import "$TF_NAME" "$VPCE_ID"
            }
            import_vpce aws_vpc_endpoint.s3                  "com.amazonaws.${REGION}.s3"
            # ecr/logs/secretsmanager endpoints have count=1, so TF address is [0]
            import_vpce "aws_vpc_endpoint.ecr_api[0]"         "com.amazonaws.${REGION}.ecr.api"
            import_vpce "aws_vpc_endpoint.ecr_dkr[0]"         "com.amazonaws.${REGION}.ecr.dkr"
            import_vpce "aws_vpc_endpoint.logs[0]"            "com.amazonaws.${REGION}.logs"
            import_vpce "aws_vpc_endpoint.secretsmanager[0]"  "com.amazonaws.${REGION}.secretsmanager"
          else
            echo "No existing project VPC found – Terraform will create a new one."
          fi

          echo "=== Import step complete ==="
          set -e

      - name: Ensure ECR repository is in Terraform state
        working-directory: aws/infrastructure
        run: |
          # Import the ECR repository unconditionally (even during force_recreate_dev).
          # The build-api job has already pushed the image to this repo, so it must
          # stay in Terraform state to prevent terraform apply from failing with
          # "ECR repository already exists".
          ECR_REPO_NAME="smart-glasses-dev-api"
          if terraform state list -lock=false 2>/dev/null | grep -qxF "aws_ecr_repository.api"; then
            echo "  ECR repository already in Terraform state"
          else
            aws ecr describe-repositories --repository-names "$ECR_REPO_NAME" --region "$AWS_REGION" >/dev/null 2>&1 \
              && terraform import -lock=false aws_ecr_repository.api "$ECR_REPO_NAME" \
              || echo "  ECR repository not found in AWS – will be created by Terraform"
          fi

      - name: Remove stale domain/ACM state entries
        timeout-minutes: 5
        working-directory: aws/infrastructure
        run: |
          # domain_name is not used in CI (no custom domain configured).
          # If the state contains route53/ACM resources from a previous run that
          # had domain_name set, Terraform will try to refresh the Route53 data
          # source and fail with "no matching Hosted Zone found".
          # Remove these entries so Terraform treats them as not managed.
          for RES in \
            "data.aws_route53_zone.main" \
            "data.aws_route53_zone.main[0]" \
            "aws_acm_certificate.cloudfront[0]" \
            "aws_acm_certificate_validation.cloudfront[0]" \
            "aws_route53_record.cert_validation" \
            "aws_route53_record.cloudfront_alias[0]"; do
            terraform state rm -lock=false "$RES" 2>/dev/null && echo "  Removed $RES" || true
          done

      - name: Terraform apply
        timeout-minutes: 20
        working-directory: aws/infrastructure
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          DB_INSTANCE_ID="smart-glasses-dev-postgres"
          DB_STATUS=$(aws rds describe-db-instances --db-instance-identifier "$DB_INSTANCE_ID" --region "$AWS_REGION" --query 'DBInstances[0].DBInstanceStatus' --output text 2>/dev/null || echo "not-found")
          if [ "$DB_STATUS" = "stopped" ]; then
            echo "RDS is stopped; starting before terraform apply..."
            aws rds start-db-instance --db-instance-identifier "$DB_INSTANCE_ID" --region "$AWS_REGION"
            aws rds wait db-instance-available --db-instance-identifier "$DB_INSTANCE_ID" --region "$AWS_REGION"
          fi
          DB_HOST=$(aws rds describe-db-instances --db-instance-identifier "$DB_INSTANCE_ID" --region "$AWS_REGION" --query 'DBInstances[0].Endpoint.Address' --output text 2>/dev/null || echo "")
          terraform apply -auto-approve -lock=false \
            -var "environment=dev" \
            -var "aws_region=${AWS_REGION}" \
            -var "s3_bucket_suffix=${ACCOUNT_ID}" \
            -var "cost_optimized_non_prod=true" \
            -var "enable_customer_managed_kms=false" \
            -var "enable_s3_versioning=false" \
            -var "dev_public_network_mode=true" \
            -var "enable_nat_gateway=false" \
            -var "enable_vpc_interface_endpoints=false" \
            -var "enable_redis=false" \
            -var "enable_container_insights=false" \
            -var "enable_rds_performance_insights=false" \
            -var "rds_monitoring_interval=0" \
            -var "ecs_api_cpu=512" \
            -var "ecs_api_memory=1024" \
            -var "ecs_api_desired_count=1" \
            -var "ecs_api_min_capacity=1" \
            -var "ecs_api_max_capacity=1" \
            -var "enable_ecs_idle_autoscaler=false" \
            -var "ecs_idle_timeout_minutes=5" \
            -var "domain_name=" \
            -var "certificate_arn=${CERTIFICATE_ARN}" \
            -var "db_host=${DB_HOST}"

      - name: Seed empty Secrets Manager secrets with placeholder values
        run: |
          # When enable_rds=false (free-tier), Terraform does NOT create a version
          # for aws_secretsmanager_secret.db_credentials or .redis_credentials.
          # ECS fails at ResourceInitializationError if a secret it references has
          # no AWSCURRENT staging label, so we seed those secrets here.
          ENV=dev
          PREFIX="smart-glasses-${ENV}"
          REGION="${AWS_REGION}"

          seed_secret_if_empty() {
            local SECRET_NAME="$1"
            local PLACEHOLDER="$2"
            # get-secret-value returns exit 1 with ResourceNotFoundException when
            # no AWSCURRENT version exists; we catch that and seed.
            aws secretsmanager get-secret-value \
              --secret-id "$SECRET_NAME" --region "$REGION" \
              --version-stage AWSCURRENT >/dev/null 2>&1 \
            && echo "  $SECRET_NAME already has a value – skipping" \
            || {
              echo "  Seeding placeholder into $SECRET_NAME ..."
              aws secretsmanager put-secret-value \
                --secret-id "$SECRET_NAME" \
                --secret-string "$PLACEHOLDER" \
                --region "$REGION" || true
            }
          }

          # DB credentials placeholder – allows the container to start even when
          # Aurora does not exist (free-tier).  The app will fail to connect but
          # will at least boot so health checks can return a non-503.
          seed_secret_if_empty "${PREFIX}-db-credentials" \
            '{"username":"placeholder","password":"placeholder","engine":"postgres","host":"localhost","port":5432,"dbname":"placeholder","connection_string":"Host=localhost;Port=5432;Database=placeholder;Username=placeholder;Password=placeholder"}'

          echo "Secret seeding complete."

      - name: Ensure ECS API log group exists
        run: |
          # Guard against prior manual cleanup/state drift that can remove the
          # log group and cause ECS ResourceInitializationError at startup.
          LOG_GROUP="/ecs/smart-glasses-dev/api"
          aws logs create-log-group --log-group-name "$LOG_GROUP" --region "$AWS_REGION" >/dev/null 2>&1 || true
          aws logs put-retention-policy --log-group-name "$LOG_GROUP" --retention-in-days 7 --region "$AWS_REGION" >/dev/null 2>&1 || true
          echo "Ensured log group: $LOG_GROUP"

      - name: Save Terraform outputs
        working-directory: aws/infrastructure
        run: |
          # Capture output; fall back to empty JSON object if Terraform errors
          # (e.g. no outputs defined or partial state) so the artifact is always
          # valid JSON that downstream jq calls can parse.
          terraform output -json > tf_outputs.json 2>/dev/null \
            || echo '{}' > tf_outputs.json
          # Verify it is valid JSON before uploading
          jq empty tf_outputs.json || echo '{}' > tf_outputs.json

      - name: Upload tf outputs
        uses: actions/upload-artifact@v4
        with:
          name: tf-outputs
          path: aws/infrastructure/tf_outputs.json
          retention-days: 1

      - name: Final storage cleanup
        if: always()
        run: |
          echo "=== Final Storage Cleanup ==="
          # Clean up Terraform state and working files
          rm -rf aws/infrastructure/.terraform aws/infrastructure/.terraform.lock.hcl aws/infrastructure/tf_image_vars.auto.tfvars || true
          # Clean up any leftover build artifacts
          rm -rf aws/lambda-document-processor/deployment.zip aws/lambda-document-processor/venv || true
          # Clean up Docker system
          docker system prune -af --volumes || true
          docker buildx prune -af || true
          # Clean up node modules from successful builds
          rm -rf src/SmartGlassesMiddleware/client/node_modules || true
          # Clean up dotnet cache
          rm -rf ~/.dotnet/temp ~/.nuget/packages/.* || true
          # Clean up any temp files
          rm -rf /tmp/* /var/tmp/* || true
          df -h
          echo "Storage cleanup complete"
    name: Build & deploy frontend to S3
    needs: terraform-apply
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}
          mask-aws-account-id: false

      - name: Download tf outputs
        uses: actions/download-artifact@v4
        with:
          name: tf-outputs
          path: ./tf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '25.8.1'
          cache: 'npm'
          cache-dependency-path: src/SmartGlassesMiddleware/client/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/SmartGlassesMiddleware/client
        run: npm ci

      - name: Build frontend
        working-directory: src/SmartGlassesMiddleware/client
        run: npm run build

      - name: Delete tf-outputs artifact (cleanup)
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "Looking up artifact ids for tf-outputs..."
          PAGE=1
          while :; do
            RESP=$(curl -s -H "Authorization: token $GH_TOKEN" "https://api.github.com/repos/${REPO}/actions/artifacts?per_page=100&page=${PAGE}") || true
            COUNT=$(echo "$RESP" | jq '.artifacts | length')
            if [ "$COUNT" -eq 0 ]; then
              break
            fi
            IDS=$(echo "$RESP" | jq -r '.artifacts[] | select(.name=="tf-outputs") | .id') || true
            if [ -n "${IDS:-}" ]; then
              for id in $IDS; do
                echo "Deleting artifact id=$id"
                curl -s -X DELETE -H "Authorization: token $GH_TOKEN" "https://api.github.com/repos/${REPO}/actions/artifacts/${id}" || true
              done
            fi
            PAGE=$((PAGE+1))
          done
          echo "tf-outputs cleanup complete."

      - name: Sync to S3
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          DEFAULT_BUCKET="smart-glasses-dev-frontend-${ACCOUNT_ID}"
          BUCKET=$(jq -r --arg def "$DEFAULT_BUCKET" '.frontend_bucket_name.value // $def' ./tf/tf_outputs.json 2>/dev/null || echo "$DEFAULT_BUCKET")
          WWWROOT="src/SmartGlassesMiddleware/wwwroot"
          echo "Deploying frontend to s3://$BUCKET"

          # index.html — never cache so stale markup is never served
          aws s3 cp "$WWWROOT/index.html" "s3://$BUCKET/index.html" \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "text/html"

          # Root shell files (admin.html/admin.js/toasts.js/etc.) should never be long-cached.
          aws s3 sync "$WWWROOT/" "s3://$BUCKET/" \
            --exclude "*" \
            --include "*.html" \
            --include "*.js" \
            --include "*.css" \
            --cache-control "no-cache,no-store,must-revalidate" \
            --delete

          # Hashed JS/CSS assets — immutable, long TTL
          aws s3 sync "$WWWROOT/assets/" "s3://$BUCKET/assets/" \
            --cache-control "public,max-age=31536000,immutable" \
            --delete

          # Large binary files (wasm, onnx, mjs) at root — long TTL
          aws s3 sync "$WWWROOT/" "s3://$BUCKET/" \
            --exclude "index.html" \
            --exclude "assets/*" \
            --exclude "*.html" \
            --exclude "*.js" \
            --exclude "*.css" \
            --cache-control "public,max-age=31536000,immutable" \
            --delete

      - name: Invalidate CloudFront cache
        run: |
          CF_ID=$(jq -r '.cloudfront_distribution_id.value // empty' ./tf/tf_outputs.json 2>/dev/null || true)
          if [ -z "$CF_ID" ]; then
            echo "No CloudFront distribution id found in Terraform outputs; skipping invalidation."
            exit 0
          fi
          echo "Invalidating CloudFront distribution $CF_ID"
          RESULT=$(aws cloudfront create-invalidation \
            --distribution-id "$CF_ID" \
            --paths "/index.html" "/*.html" "/*.js" "/*.css" \
            --query "Invalidation.{Id:Id,Status:Status}" \
            --output json)
          echo "Invalidation: $RESULT"

      - name: Cleanup frontend build artifacts
        if: always()
        run: |
          echo "Cleaning up frontend build artifacts..."
          # Remove node_modules to save space
          rm -rf src/SmartGlassesMiddleware/client/node_modules || true
          rm -rf src/SmartGlassesMiddleware/client/.next || true
          # Clean npm cache
          npm cache clean --force || true
          # Clean build cache
          rm -rf /tmp/npm-* || true
          echo "Frontend cleanup complete"

  run-migrations:
    name: Run EF Core database migrations
    needs: terraform-apply
    # Fresh dev setups usually have no schema to migrate; only run when
    # explicitly requested from workflow_dispatch with skip_migrations=false.
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.skip_migrations == 'false' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
    steps:
      - name: Download tf outputs
        uses: actions/download-artifact@v4
        with:
          name: tf-outputs
          path: ./tf

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Run one-shot migration task
        run: |
          CLUSTER=$(jq -r '.ecs_cluster_name.value // empty' ./tf/tf_outputs.json 2>/dev/null || true)
          CLUSTER=${CLUSTER:-smart-glasses-dev-cluster}
          SERVICE="smart-glasses-dev-api-service"

          echo "Fetching task definition and network config from ECS service..."
          SERVICE_JSON=$(aws ecs describe-services \
            --cluster "$CLUSTER" --services "$SERVICE" \
            --region "$AWS_REGION" \
            --query 'services[0]' --output json)

          TASK_DEF=$(echo "$SERVICE_JSON" | jq -r '.taskDefinition')
          SUBNETS=$(echo "$SERVICE_JSON" | jq -r '[.networkConfiguration.awsvpcConfiguration.subnets[]] | join(",")')
          SGS=$(echo "$SERVICE_JSON"    | jq -r '[.networkConfiguration.awsvpcConfiguration.securityGroups[]] | join(",")')
          ASSIGN_PUBLIC_IP=$(echo "$SERVICE_JSON" | jq -r '.networkConfiguration.awsvpcConfiguration.assignPublicIp // "DISABLED"')

          echo "Using task definition: $TASK_DEF"
          echo "Migration task network: assignPublicIp=$ASSIGN_PUBLIC_IP"

          TASK_ARN=$(aws ecs run-task \
            --cluster "$CLUSTER" \
            --task-definition "$TASK_DEF" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SGS],assignPublicIp=$ASSIGN_PUBLIC_IP}" \
            --overrides '{"containerOverrides":[{"name":"api","environment":[{"name":"MIGRATE_ONLY","value":"true"},{"name":"MIGRATE_ON_STARTUP","value":"false"}]}]}' \
            --count 1 \
            --query 'tasks[0].taskArn' \
            --output text)

          echo "Migration task: $TASK_ARN"
          echo "Waiting for task to stop (up to 10 min)..."
          aws ecs wait tasks-stopped \
            --cluster "$CLUSTER" --tasks "$TASK_ARN" \
            --region "$AWS_REGION"

          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster "$CLUSTER" --tasks "$TASK_ARN" \
            --region "$AWS_REGION" \
            --query 'tasks[0].containers[0].exitCode' \
            --output text)

          STOP_REASON=$(aws ecs describe-tasks \
            --cluster "$CLUSTER" --tasks "$TASK_ARN" \
            --region "$AWS_REGION" \
            --query 'tasks[0].stoppedReason' \
            --output text)

          CONTAINER_REASON=$(aws ecs describe-tasks \
            --cluster "$CLUSTER" --tasks "$TASK_ARN" \
            --region "$AWS_REGION" \
            --query 'tasks[0].containers[0].reason' \
            --output text)

          echo "Migration task exit code: $EXIT_CODE"
          echo "Migration task stopped reason: ${STOP_REASON:-n/a}"
          echo "Migration task container reason: ${CONTAINER_REASON:-n/a}"
          if [ "$EXIT_CODE" != "0" ]; then
            echo "Migration task failed — fetching logs..."
            LOG_GROUP="/ecs/smart-glasses-dev/api"
            TASK_ID=$(basename "$TASK_ARN")
            aws logs get-log-events \
              --log-group-name "$LOG_GROUP" \
              --log-stream-name "ecs/api/$TASK_ID" \
              --limit 80 --region "$AWS_REGION" \
              --query 'events[*].message' --output text 2>/dev/null || true
            exit 1
          fi
          echo "Migrations applied successfully."

  verify-deployment:
    name: Wait for ECS service stability
    needs: [terraform-apply, deploy-frontend, run-migrations]
    if: ${{ always() && needs.terraform-apply.result == 'success' && needs.deploy-frontend.result == 'success' && (needs.run-migrations.result == 'success' || needs.run-migrations.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
    steps:
      - name: Download tf outputs
        uses: actions/download-artifact@v4
        with:
          name: tf-outputs
          path: ./tf

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Wait for ECS service to stabilize
        run: |
          CLUSTER=$(jq -r '.ecs_cluster_name.value // empty' ./tf/tf_outputs.json 2>/dev/null || true)
          CLUSTER=${CLUSTER:-smart-glasses-dev-cluster}
          SERVICE=$(aws ecs list-services \
            --cluster "$CLUSTER" --region "$AWS_REGION" \
            --query 'serviceArns[?ends_with(@, `-api-service`)] | [0]' \
            --output text 2>/dev/null | awk -F/ '{print $NF}')
          if [ -z "$SERVICE" ] || [ "$SERVICE" = "None" ] || [ "$SERVICE" = "null" ]; then
            SERVICE="smart-glasses-dev-api-service"
          fi
          echo "Waiting for ECS service $SERVICE in cluster $CLUSTER (up to 15 min)..."
          # Use a longer poll loop instead of the default 10-min waiter
          STABLE=false
          for attempt in $(seq 1 30); do
            # Single API call per iteration (was 3 separate calls before)
            ECS_JSON=$(aws ecs describe-services \
              --cluster "$CLUSTER" --services "$SERVICE" --region "$AWS_REGION" \
              --query 'services[0].{running:runningCount,desired:desiredCount,pending:pendingCount}' \
              --output json 2>/dev/null || echo '{}')
            RUNNING=$(echo "$ECS_JSON" | jq -r '.running // 0')
            DESIRED=$(echo "$ECS_JSON" | jq -r '.desired // 1')
            PENDING=$(echo "$ECS_JSON" | jq -r '.pending // 99')
            echo "Attempt $attempt/30: running=$RUNNING desired=$DESIRED pending=$PENDING"
            # desired=0 is valid: scale-to-zero is active, deployment is complete
            if [ "$DESIRED" = "0" ]; then
              echo "ECS service desired=0 (scale-to-zero active) — deployment complete."
              STABLE=true
              break
            fi
            if [ "$RUNNING" = "$DESIRED" ] && [ "$PENDING" = "0" ]; then
              echo "ECS service is stable."
              STABLE=true
              break
            fi
            # Print recent ECS events every 5 attempts for diagnostics
            if [ $((attempt % 5)) -eq 0 ]; then
              echo "--- Recent ECS service events ---"
              aws ecs describe-services \
                --cluster "$CLUSTER" --services "$SERVICE" --region "$AWS_REGION" \
                --query 'services[0].events[0:5].[createdAt,message]' \
                --output text 2>/dev/null || true
              echo "--- Recent stopped task reasons ---"
              aws ecs list-tasks --cluster "$CLUSTER" --service-name "$SERVICE" \
                --desired-status STOPPED --region "$AWS_REGION" \
                --query 'taskArns[0:2]' --output text 2>/dev/null \
                | tr '\t' '\n' | grep -v '^$' \
                | while read -r TASK_ARN; do
                  aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN" \
                    --region "$AWS_REGION" \
                    --query 'tasks[0].containers[0].{reason:reason,exitCode:exitCode}' \
                    --output json 2>/dev/null || true
                done
            fi
            sleep 30
          done
          if [ "$STABLE" = "false" ]; then
            echo "ECS service did not reach stable state within 15 minutes."
            echo "Failing deployment because desired task count is non-zero but service never stabilized."
            exit 1
          fi

      - name: Fetch ECS container logs from CloudWatch
        if: always()
        run: |
          CLUSTER=$(jq -r '.ecs_cluster_name.value // empty' ./tf/tf_outputs.json 2>/dev/null || true)
          CLUSTER=${CLUSTER:-smart-glasses-dev-cluster}
          SERVICE=$(aws ecs list-services \
            --cluster "$CLUSTER" --region "$AWS_REGION" \
            --query 'serviceArns[?ends_with(@, `-api-service`)] | [0]' \
            --output text 2>/dev/null | awk -F/ '{print $NF}')
          if [ -z "$SERVICE" ] || [ "$SERVICE" = "None" ] || [ "$SERVICE" = "null" ]; then
            SERVICE="smart-glasses-dev-api-service"
          fi
          PREFIX="${SERVICE%-api-service}"
          LOG_GROUP="/ecs/${PREFIX}/api"
          echo "=== Last container logs from $LOG_GROUP ==="
          # Get the most recent log stream
          STREAM=$(aws logs describe-log-streams \
            --log-group-name "$LOG_GROUP" \
            --order-by LastEventTime \
            --descending \
            --query 'logStreams[0].logStreamName' \
            --output text --region "$AWS_REGION" 2>/dev/null || true)
          if [ -z "$STREAM" ] || [ "$STREAM" = "None" ]; then
            echo "No log streams found in $LOG_GROUP"
          else
            echo "Stream: $STREAM"
            aws logs get-log-events \
              --log-group-name "$LOG_GROUP" \
              --log-stream-name "$STREAM" \
              --limit 80 \
              --region "$AWS_REGION" \
              --query 'events[*].message' \
              --output text 2>/dev/null || echo "(could not read log events)"
          fi

      - name: Smoke-test health endpoint
        run: |
          CLUSTER=$(jq -r '.ecs_cluster_name.value // empty' ./tf/tf_outputs.json 2>/dev/null || true)
          CLUSTER=${CLUSTER:-smart-glasses-dev-cluster}
          SERVICE=$(aws ecs list-services \
            --cluster "$CLUSTER" --region "$AWS_REGION" \
            --query 'serviceArns[?ends_with(@, `-api-service`)] | [0]' \
            --output text 2>/dev/null | awk -F/ '{print $NF}')
          if [ -z "$SERVICE" ] || [ "$SERVICE" = "None" ] || [ "$SERVICE" = "null" ]; then
            SERVICE="smart-glasses-dev-api-service"
          fi
          PREFIX="${SERVICE%-api-service}"
          DESIRED=$(aws ecs describe-services \
            --cluster "$CLUSTER" --services "$SERVICE" --region "$AWS_REGION" \
            --query 'services[0].desiredCount' --output text 2>/dev/null || echo "0")

          # In scale-to-zero mode there may be no healthy endpoint until wake-up.
          if [ "$DESIRED" = "0" ]; then
            echo "ECS desired count is 0; skipping strict health smoke test."
            exit 0
          fi

          ALB=$(jq -r '.api_alb_dns.value // empty' ./tf/tf_outputs.json 2>/dev/null || true)
          # tf_outputs.json can be '{}' when terraform output emits non-JSON.
          # Fall back to querying AWS directly so smoke tests remain reliable.
          if [ -z "$ALB" ]; then
            TG_ARN=$(aws ecs describe-services \
              --cluster "$CLUSTER" --services "$SERVICE" --region "$AWS_REGION" \
              --query 'services[0].loadBalancers[0].targetGroupArn' \
              --output text 2>/dev/null || true)
            if [ -n "$TG_ARN" ] && [ "$TG_ARN" != "None" ] && [ "$TG_ARN" != "null" ]; then
              LB_ARN=$(aws elbv2 describe-target-groups \
                --target-group-arns "$TG_ARN" \
                --region "$AWS_REGION" \
                --query 'TargetGroups[0].LoadBalancerArns[0]' \
                --output text 2>/dev/null || true)
              if [ -n "$LB_ARN" ] && [ "$LB_ARN" != "None" ] && [ "$LB_ARN" != "null" ]; then
                ALB=$(aws elbv2 describe-load-balancers \
                  --load-balancer-arns "$LB_ARN" \
                  --region "$AWS_REGION" \
                  --query 'LoadBalancers[0].DNSName' \
                  --output text 2>/dev/null || true)
              fi
            fi

            # Last resort: infer ALB name from ECS service prefix.
            if [ -z "$ALB" ] || [ "$ALB" = "None" ] || [ "$ALB" = "null" ]; then
              ALB=$(aws elbv2 describe-load-balancers \
                --names "${PREFIX}-api-alb" \
                --region "$AWS_REGION" \
                --query 'LoadBalancers[0].DNSName' \
                --output text 2>/dev/null || true)
            fi
          fi
          if [ "$ALB" = "None" ] || [ "$ALB" = "null" ]; then
            ALB=""
          fi
          if [ -z "$ALB" ]; then
            echo "ALB DNS not available in outputs while desired count is $DESIRED."
            exit 1
          fi
          echo "Health check: http://${ALB}/health"
          for i in $(seq 1 5); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://${ALB}/health" || true)
            echo "Attempt $i: HTTP $STATUS"
            [ "$STATUS" = "200" ] && exit 0
            sleep 15
          done
          echo "Health check did not return 200 after retries while desired count is $DESIRED."
          exit 1

      - name: Print deployed website URL
        if: success()
        run: |
          set -euo pipefail

          WEBSITE_URL=$(jq -r '.website_url.value // empty' ./tf/tf_outputs.json 2>/dev/null || true)
          if [ -z "$WEBSITE_URL" ] || [ "$WEBSITE_URL" = "None" ] || [ "$WEBSITE_URL" = "null" ]; then
            CF_DOMAIN=$(aws cloudfront list-distributions \
              --query 'DistributionList.Items[?contains(Comment, `smart-glasses dev frontend`)].DomainName | [0]' \
              --output text 2>/dev/null || true)
            if [ -z "$CF_DOMAIN" ] || [ "$CF_DOMAIN" = "None" ] || [ "$CF_DOMAIN" = "null" ]; then
              CF_DOMAIN=$(aws cloudfront list-distributions \
                --query 'DistributionList.Items[0].DomainName' \
                --output text 2>/dev/null || true)
            fi

            if [ -n "$CF_DOMAIN" ] && [ "$CF_DOMAIN" != "None" ] && [ "$CF_DOMAIN" != "null" ]; then
              WEBSITE_URL="https://${CF_DOMAIN}"
            fi
          fi

          if [ -z "${WEBSITE_URL:-}" ]; then
            echo "::warning::Deployment completed, but website URL could not be resolved."
            exit 0
          fi

          echo "Deployment URL: ${WEBSITE_URL}"
          echo "::notice title=Deployment URL::${WEBSITE_URL}"
