name: Download and Publish Whisper Model (artifact)

on:
  workflow_dispatch:

jobs:
  download-and-upload-artifact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install huggingface-hub

      - name: Download model from Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          MODEL_ID: "Xenova/whisper-tiny.en"
        run: |
          python - <<'PY'
          import os, shutil
          from huggingface_hub import snapshot_download

          model = os.environ.get('MODEL_ID') or 'Xenova/whisper-tiny.en'
          out_dir = 'model_download'
          print('Downloading model:', model)
          snapshot_download(repo_id=model, local_dir=out_dir, token=os.environ.get('HF_TOKEN'))

          target = 'src/SmartGlassesMiddleware/wwwroot/models/Xenova/whisper-tiny.en'
          os.makedirs(os.path.dirname(target), exist_ok=True)
          if os.path.exists(target):
              shutil.rmtree(target)
          shutil.copytree(out_dir, target)
          print('Model copied to', target)
          PY

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: whisper-model
          path: src/SmartGlassesMiddleware/wwwroot/models/
