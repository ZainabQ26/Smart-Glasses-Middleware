<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Glasses - File & Prompt Management</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #f5f5f5;
            --bg-secondary: #ffffff;
            --bg-tertiary: #f8f9fa;
            --text-primary: #333;
            --text-secondary: #555;
            --text-tertiary: #7f8c8d;
            --border-color: #ddd;
            --border-light: #e0e0e0;
            --header-bg: #2c3e50;
            --header-text: #ffffff;
            --accent-color: #3498db;
            --accent-hover: #2980b9;
            --danger-color: #e74c3c;
            --danger-hover: #c0392b;
            --success-bg: #d4edda;
            --success-text: #155724;
            --success-border: #c3e6cb;
            --error-bg: #f8d7da;
            --error-text: #721c24;
            --error-border: #f5c6cb;
            --badge-bg: #ecf0f1;
            --shadow: rgba(0,0,0,0.1);
            --input-invalid: #e74c3c;
        }

        [data-theme="dark"] {
            --bg-primary: #1a1a1a;
            --bg-secondary: #2d2d2d;
            --bg-tertiary: #383838;
            --text-primary: #e0e0e0;
            --text-secondary: #b0b0b0;
            --text-tertiary: #888888;
            --border-color: #444;
            --border-light: #3a3a3a;
            --header-bg: #1c1c1c;
            --header-text: #ffffff;
            --accent-color: #3498db;
            --accent-hover: #2980b9;
            --danger-color: #e74c3c;
            --danger-hover: #c0392b;
            --success-bg: #1e4620;
            --success-text: #7dd87f;
            --success-border: #2d5a2f;
            --error-bg: #4a1c1c;
            --error-text: #f5a3a3;
            --error-border: #5f2828;
            --badge-bg: #3a3a3a;
            --shadow: rgba(0,0,0,0.3);
            --input-invalid: #e74c3c;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            background-color: var(--header-bg);
            color: var(--header-text);
            padding: 20px 0;
            margin-bottom: 30px;
        }

        header .header-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 2rem;
            margin: 0;
        }

        .theme-toggle {
            background-color: transparent;
            border: 2px solid var(--header-text);
            color: var(--header-text);
            padding: 8px 16px;
            cursor: pointer;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .theme-toggle:hover {
            background-color: var(--header-text);
            color: var(--header-bg);
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border-color);
        }

        .tab {
            padding: 12px 24px;
            background-color: transparent;
            border: none;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            color: var(--text-tertiary);
            border-bottom: 3px solid transparent;
            transition: all 0.3s ease;
        }

        .tab:hover {
            color: var(--text-primary);
        }

        .tab.active {
            color: var(--text-primary);
            border-bottom-color: var(--accent-color);
        }

        .tab-content {
            display: none;
            background-color: var(--bg-secondary);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 4px var(--shadow);
        }

        .tab-content.active {
            display: block;
        }

        .section {
            margin-bottom: 30px;
        }

        .section h2 {
            color: var(--text-primary);
            margin-bottom: 15px;
            font-size: 1.5rem;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        input[type="text"],
        input[type="file"],
        textarea,
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 14px;
            background-color: var(--bg-secondary);
            color: var(--text-primary);
            transition: border-color 0.3s ease;
        }

        input[type="text"]:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        input[type="text"].invalid,
        textarea.invalid,
        select.invalid {
            border-color: var(--input-invalid);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        button {
            padding: 10px 20px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        button.delete {
            background-color: var(--danger-color);
        }

        button.delete:hover {
            background-color: var(--danger-hover);
        }

        button.secondary {
            background-color: #95a5a6;
        }

        button.secondary:hover {
            background-color: #7f8c8d;
        }

        button.execute {
            background-color: #27ae60;
        }

        button.execute:hover {
            background-color: #229954;
        }

        .card {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-light);
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 15px;
            transition: box-shadow 0.3s ease, cursor 0.3s ease;
        }

        .card:hover {
            box-shadow: 0 4px 8px var(--shadow);
        }

        .card.clickable {
            cursor: pointer;
        }

        .card.clickable:hover {
            box-shadow: 0 6px 12px var(--shadow);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .card-title {
            font-weight: 600;
            color: var(--text-primary);
            font-size: 1.1rem;
        }

        .card-meta {
            font-size: 0.85rem;
            color: var(--text-tertiary);
            margin-bottom: 10px;
        }

        .card-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .card-actions button {
            padding: 6px 12px;
            font-size: 13px;
        }

        .badge {
            display: inline-block;
            padding: 4px 8px;
            background-color: var(--badge-bg);
            color: var(--text-primary);
            border-radius: 3px;
            font-size: 0.75rem;
            margin-right: 5px;
            margin-bottom: 5px;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--text-tertiary);
        }

        .empty-state p {
            font-size: 1.1rem;
            margin-bottom: 15px;
        }

        .message {
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 15px;
        }

        .message.success {
            background-color: var(--success-bg);
            color: var(--success-text);
            border: 1px solid var(--success-border);
        }

        .message.error {
            background-color: var(--error-bg);
            color: var(--error-text);
            border: 1px solid var(--error-border);
        }

        .field-error {
            color: var(--input-invalid);
            font-size: 0.85rem;
            margin-top: 4px;
            display: none;
        }

        .field-error.visible {
            display: block;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background-color: var(--bg-secondary);
            border-radius: 8px;
            padding: 25px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-content.large {
            max-width: 900px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h3 {
            color: var(--text-primary);
            font-size: 1.3rem;
        }

        .close-modal {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            padding: 0;
            color: var(--text-tertiary);
        }

        .close-modal:hover {
            color: var(--text-primary);
        }

        .preview-container {
            width: 100%;
            max-height: 60vh;
            overflow: auto;
            margin-bottom: 20px;
            background-color: var(--bg-tertiary);
            border-radius: 4px;
            padding: 10px;
        }

        .preview-container img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
        }

        .preview-container pre {
            white-space: pre-wrap;
            word-wrap: break-word;
            color: var(--text-primary);
        }

        .preview-container iframe {
            width: 100%;
            height: 70vh;
            border: none;
        }

        .execution-result {
            margin-top: 15px;
            padding: 15px;
            background-color: var(--bg-tertiary);
            border-radius: 4px;
            border-left: 4px solid var(--accent-color);
        }

        .execution-result pre {
            white-space: pre-wrap;
            word-wrap: break-word;
            margin: 0;
            color: var(--text-primary);
        }

        .checkbox-group {
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 10px;
            background-color: var(--bg-secondary);
        }

        .checkbox-item {
            padding: 5px 0;
        }

        .checkbox-item label {
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .checkbox-item input[type="checkbox"] {
            width: auto;
            margin-right: 8px;
        }

        .group-resources {
            margin-top: 10px;
            padding-left: 15px;
        }

        .group-resources-title {
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 5px;
        }

        .loading-indicator {
            text-align: center;
            padding: 20px;
            color: var(--text-tertiary);
        }

        .loading-indicator::after {
            content: '...';
            animation: dots 1.5s infinite;
        }

        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }

        .scroll-to-load {
            text-align: center;
            padding: 15px;
            color: var(--text-tertiary);
            font-size: 0.9rem;
        }

        .hidden {
            display: none !important;
        }

        /* Smooth transitions */
        .card {
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Better responsive design */
        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }

            header h1 {
                font-size: 1.5rem;
            }

            .tab {
                padding: 10px 16px;
                font-size: 14px;
            }

            .card-actions {
                flex-direction: column;
            }

            .card-actions button {
                width: 100%;
            }
        }

        /* Improved button styles */
        button {
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        button:active::before {
            width: 300px;
            height: 300px;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <h1>Smart Glasses - Admin Panel</h1>
            <button class="theme-toggle" id="theme-toggle">
                🌙 Dark Mode
            </button>
        </div>
    </header>

    <div class="container">
        <div id="message-container"></div>

        <div class="tabs">
            <button class="tab active" data-tab="files">Files</button>
            <button class="tab" data-tab="prompts">Prompts</button>
            <button class="tab" data-tab="groups">Groups</button>
        </div>

        <!-- Files Tab -->
        <div id="files" class="tab-content active">
            <div class="section">
                <h2>Upload File</h2>
                <form id="upload-form">
                    <div class="form-group">
                        <label for="file-input">Select File</label>
                        <input type="file" id="file-input" required>
                    </div>
                    <div class="form-group">
                        <label for="file-label">Label</label>
                        <input type="text" id="file-label" placeholder="Enter a label for this file" required>
                    </div>
                    <button type="submit">Upload File</button>
                </form>
            </div>

            <div class="section">
                <h2>Uploaded Files</h2>
                <div id="files-list"></div>
            </div>
        </div>

        <!-- Prompts Tab -->
        <div id="prompts" class="tab-content">
            <div class="section">
                <h2>Add Prompt</h2>
                <form id="prompt-form" enctype="multipart/form-data">
                    <input type="hidden" id="prompt-id">
                    <div class="form-group hidden">
                        <label for="prompt-name">Name (optional)</label>
                        <input type="text" id="prompt-name" placeholder="Enter prompt name">
                    </div>
                    <div class="form-group">
                        <label for="prompt-text">Prompt Text *</label>
                        <textarea id="prompt-text" placeholder="Enter prompt text" required></textarea>
                        <div class="field-error" id="prompt-text-error"></div>
                    </div>
                    <div class="form-group">
                        <label for="prompt-file">Attachment (optional)</label>
                        <input type="file" id="prompt-file">
                    </div>
                    <button type="submit" id="prompt-submit-btn">Add Prompt</button>
                    <button type="button" id="prompt-cancel-btn" class="secondary" style="display: none;">Cancel</button>
                </form>
            </div>

            <div class="section">
                <h2>Saved Prompts</h2>
                <div id="prompts-list"></div>
            </div>
        </div>

        <!-- Groups Tab -->
        <div id="groups" class="tab-content">
            <div class="section">
                <h2>Create Group</h2>
                <form id="group-form">
                    <input type="hidden" id="group-id">
                    <div class="form-group">
                        <label for="group-name">Name</label>
                        <input type="text" id="group-name" placeholder="Enter group name" required>
                    </div>
                    <div class="form-group">
                        <label for="group-description">Description (optional)</label>
                        <textarea id="group-description" placeholder="Enter group description"></textarea>
                    </div>
                    <button type="submit" id="group-submit-btn">Create Group</button>
                    <button type="button" id="group-cancel-btn" class="secondary" style="display: none;">Cancel</button>
                </form>
            </div>

            <div class="section">
                <h2>Resource Groups</h2>
                <div id="groups-list"></div>
            </div>
        </div>
    </div>

    <!-- Manage Group Resources Modal -->
    <div id="manage-group-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Manage Group Resources</h3>
                <button class="close-modal" id="close-modal-btn">&times;</button>
            </div>
            <div id="modal-content-body"></div>
        </div>
    </div>

    <!-- File Preview Modal -->
    <div id="preview-modal" class="modal">
        <div class="modal-content large">
            <div class="modal-header">
                <h3 id="preview-title">File Preview</h3>
                <button class="close-modal" id="close-preview-btn">&times;</button>
            </div>
            <div id="preview-body"></div>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
