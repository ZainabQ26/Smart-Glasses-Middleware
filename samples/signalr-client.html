<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>SignalR Task Notifications</title>
</head>
<body>
  <h3>Task notifications</h3>
  <ul id="messages"></ul>

  <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@7.0.5/dist/browser/signalr.min.js"></script>
  <script>
    const connection = new signalR.HubConnectionBuilder()
      .withUrl('/hubs/tasks')
      .withAutomaticReconnect()
      .build();

    connection.on('TaskCompleted', (payload) => {
      const li = document.createElement('li');
      li.textContent = `Task ${payload.id} ${payload.status} - ${payload.error ?? ''}`;
      document.getElementById('messages').appendChild(li);
      console.log('TaskCompleted', payload);
    });

    connection.start()
      .then(() => console.log('Connected to TaskHub'))
      .catch(err => console.error(err));
  </script>
</body>
</html>
